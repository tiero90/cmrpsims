<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CMRP Exam Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one centered work column (max 880px); sticky instrument bar during an exam; cards only for selectable things. */
:root{
  --bg:#eef1ef; --surface:#ffffff; --sunk:#e3e8e5; --line:#cdd5d1;
  --ink:#16201d; --muted:#56655f; --accent:#0d6b5c; --accent-ink:#ffffff; --accent-soft:#d5ebe5;
  --flag:#b86e00; --flag-soft:#fbecd2; --ok:#1f7a3a; --ok-soft:#dcf0e1; --bad:#b4322a; --bad-soft:#f8dedb;
  --p1:#2f5d8a; --p2:#8a5a2f; --p3:#0d6b5c; --p4:#7a3f7a; --p5:#5f6a1f;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201d; --sunk:#202a26; --line:#2f3b36;
  --ink:#e6ece9; --muted:#97a6a0; --accent:#3fb39d; --accent-ink:#06211b; --accent-soft:#163a33;
  --flag:#f0a63a; --flag-soft:#3a2c14; --ok:#5ccb7c; --ok-soft:#173523; --bad:#f07a70; --bad-soft:#3d1d1a;
  --p1:#7fa9d6; --p2:#d6a27a; --p3:#3fb39d; --p4:#c98bc9; --p5:#b5c26a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201d; --sunk:#202a26; --line:#2f3b36;
  --ink:#e6ece9; --muted:#97a6a0; --accent:#3fb39d; --accent-ink:#06211b; --accent-soft:#163a33;
  --flag:#f0a63a; --flag-soft:#3a2c14; --ok:#5ccb7c; --ok-soft:#173523; --bad:#f07a70; --bad-soft:#3d1d1a;
  --p1:#7fa9d6; --p2:#d6a27a; --p3:#3fb39d; --p4:#c98bc9; --p5:#b5c26a; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(34px,6vw,52px)}
h2{font-size:26px}
h3{font-size:20px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
section{display:flex;flex-direction:column;gap:14px}

/* Home */
.hero{padding-block:36px 8px;display:flex;flex-direction:column;gap:12px}
.hero p{max-width:62ch}
.spec{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.spec div{flex:1 1 140px;padding:12px 16px;border-right:1px solid var(--line)}
.spec div:last-child{border-right:0}
.spec b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600}
.spec span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mode.main{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 10px;width:100%}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;border-radius:6px}
.check input{margin-top:4px;accent-color:var(--accent)}
.dist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dist .field label{font-size:11px;font-family:var(--f-mono)}
.dist input{text-align:center;padding:0 4px}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.pill{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--pc)}
.pill .n{font-family:var(--f-mono);font-size:12px;color:var(--pc);font-weight:600}
.pill h3{font-size:18px}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--pc)}
.hist{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
.hist table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.hist th,.hist td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.hist th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.hist tr:last-child td{border-bottom:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.flag{background:var(--flag-soft);color:var(--flag)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pc);display:inline-block}
.resume{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border:1px solid var(--flag);background:var(--flag-soft);border-radius:var(--r);padding:14px 16px}

/* Exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.timer{font-family:var(--f-mono);font-size:26px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.timer.warn{color:var(--flag);border-color:var(--flag)}
.timer.crit{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.progress{flex:1 1 200px;display:flex;flex-direction:column;gap:4px;min-width:160px}
.progress .meter{height:8px}
.progress .meter i{background:var(--accent)}
.qcard{margin-top:22px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.qtext{font-size:clamp(17px,2.4vw,20px);line-height:1.5;font-weight:500;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;width:34px;height:34px;border-radius:6px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.opt .t{padding-top:5px;min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--accent);background:var(--sunk);padding:12px 14px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:4px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-family:var(--f-mono)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.qsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qlist li{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;min-width:0}
.qlist li:last-child{border-bottom:0}
mark{background:var(--flag-soft);color:inherit;border-radius:3px;padding:0 2px}
#qres{display:flex;flex-direction:column;gap:10px}
.ex{white-space:pre-line;overflow-wrap:anywhere}
.tag.calc{background:var(--accent-soft);color:var(--accent)}
.explain.bad{border-color:var(--bad)}
.explain.good{border-color:var(--ok)}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.cell{height:38px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:13px;position:relative}
.cell.ans{background:var(--accent-soft);border-color:var(--accent)}
.cell.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.r{background:var(--ok-soft);border-color:var(--ok)}
.cell.w{background:var(--bad-soft);border-color:var(--bad)}
.panel{margin-top:16px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}

/* Results */
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding-block:28px 6px}
.gauge{width:150px;height:150px;max-width:100%}
.verdict{display:flex;flex-direction:column;gap:8px;min-width:0}
.big{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1}
.bars{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px}
.barrow{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr auto;gap:12px;align-items:center;font-size:14px}
.barrow .meter{height:10px}
.barrow .meter{position:relative}
.target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rev{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.rev .qtext{font-size:16px}
.ans{display:flex;flex-direction:column;gap:6px;font-size:14px}
.ans div{display:grid;grid-template-columns:110px 1fr;gap:8px}
.ans div > span:first-child{color:var(--muted)}
.ref{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
footer{margin-top:40px;font-size:12.5px;color:var(--muted);max-width:70ch}
@media (max-width:560px){
  .score{grid-template-columns:1fr;justify-items:start}
  .barrow{grid-template-columns:1fr auto}
  .barrow .meter{grid-column:1/-1;grid-row:2}
  .dist{grid-template-columns:repeat(5,minmax(0,1fr))}
  .timer{font-size:22px}
  .ans div{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .4s ease}}
</style>
</head>

<script>
var QB={};
QB[1]=[
["According to Gulati, a best practice is best described as:","A documented method proven more effective than others at delivering the desired outcome","A method used by an organization for many years that consistently produces acceptable results","A practice recommended by the OEM in the equipment operating manual","A method that achieves the lowest maintenance cost per unit produced","Best practice = praktik terdokumentasi yang terbukti paling efektif dan biasanya menjadi benchmark. Hasil yang 'cukup' atau sekadar biaya terendah bukan definisi best practice.",1],
["A benchmark is:","A reference measure recognized as the standard of excellence for a process","The average performance of companies in the same industry sector","A performance target set internally by management for the next fiscal year","The documented process used by the best-performing competitor","Benchmark = ukuran referensi standar keunggulan. Proses/praktik yang menghasilkannya disebut best practice, bukan benchmark.",1],
["According to Gulati, the performance of an asset depends on which three factors?","Inherent reliability, operating environment, and maintenance plan","Inherent reliability, spare parts availability, and maintenance plan","Design capacity, operator skill, and maintenance budget","Operating environment, criticality ranking, and PM frequency","Kinerja aset = keandalan bawaan (desain), lingkungan operasi, dan rencana perawatan.",1],
["Several studies cited by Gulati indicate that what share of failures result from operational errors or lack of understanding?","40% or more","About 10%","About 25%","20% or less","Sekitar 40% atau lebih kegagalan berasal dari kesalahan operasi, sehingga pelatihan operator penting.",1],
["Which is one of the four fundamental reasons Gulati gives for failing to implement best practices?","Inability to correlate best practice cause and effect","Lack of a modern CMMS or EAM system","Insufficient number of maintenance technicians","Absence of a formal reliability engineering department","Empat alasan dasar: tidak paham risiko bisnis, tidak mampu mengaitkan sebab-akibat, takut perubahan, kendala anggaran dan jadwal.",1],
["Maintenance cost as a percentage of replacement asset value (RAV) is calculated as:","Total annual maintenance cost divided by RAV","Maintenance labor and material cost divided by plant book value","Total annual maintenance cost divided by annual sales revenue","Maintenance material cost divided by RAV","Metrik ini membandingkan seluruh biaya perawatan tahunan dengan nilai penggantian aset, bukan nilai buku atau penjualan.",1],
["[Calc] A plant spends $4.5 million per year on maintenance and has an RAV of $150 million. Maintenance cost as % of RAV is:","3.0%","4.5%","1.5%","6.0%","Rumus:\n  Biaya perawatan % RAV = Biaya perawatan tahunan ÷ RAV × 100%\n\nDiketahui:\n  Biaya perawatan = $4,5 juta\n  RAV = $150 juta\n\nLangkah:\n1) 4,5 ÷ 150 = 0,03\n2) 0,03 × 100% = 3,0%\n\nJawaban: 3,0%. Pastikan kedua angka dalam satuan yang sama (juta).",1],
["The RAV figure used for benchmarking should typically come from:","Engineering or the insurance carrier, as current replacement cost","Accounting, as the net book value after depreciation","Purchasing, as the original acquisition cost of all installed assets","Finance, as the market resale value of the plant","RAV adalah biaya penggantian saat ini (termasuk bongkar-pasang), bukan nilai buku akuntansi.",1],
["Which cost does Gulati include in maintenance cost for the RAV benchmark?","Capital maintenance and projects to replace worn-out assets","Capital projects to expand capacity and add new product lines","Operator labor for routine production activities","Depreciation of maintenance tools and vehicles","Biaya perawatan mencakup tenaga kerja, material, kontraktor, capital maintenance, dan penggantian aset aus; proyek ekspansi tidak termasuk.",1],
["When comparing benchmarks with another company, the most important precaution is to:","Confirm both organizations use the same metric definitions","Compare with companies in the same country first","Use data from the last five years instead of one year","Exclude contractor costs from both organizations' data","Definisi metrik harus sama agar perbandingan valid; SMRP membakukan definisi metrik.",9],
["Organization A has 40% schedule compliance; Organization B has 80%. What does this indicate?","B gets about twice as much scheduled work from its staff","B has twice as much backlog as A","B needs about half the planners that A needs","B has twice the wrench time and half the reactive work of A","Gulati: 80% vs 40% berarti B menyelesaikan sekitar dua kali pekerjaan terjadwal; tidak langsung berarti wrench time dua kali.",1],
["A vision statement primarily describes:","Where the organization wants to be in the future","The organization's purpose and the customers it serves","The values that guide employee behavior","The measurable targets for the coming year","Visi = masa depan yang dituju. Tujuan dan pelanggan = misi; nilai = values; target terukur = goals.",2],
["A mission statement primarily describes an organization's:","Purpose: what it does and how it does it","Desired future state in the long term","Core values and code of conduct","Strategic goals and key metrics","Misi menyatakan tujuan/purpose organisasi saat ini; visi = kondisi masa depan.",2],
["In a SMART goal, the letter A most commonly stands for:","Achievable","Accountable","Aligned","Actionable","SMART = Specific, Measurable, Achievable, Relevant/Realistic, Time-bound.",2],
["Which SWOT elements are external to the organization?","Opportunities and threats","Strengths and weaknesses","Strengths and opportunities","Weaknesses and threats","Peluang dan ancaman berasal dari lingkungan eksternal; kekuatan dan kelemahan internal.",2],
["Which of the following is a leading indicator?","PM compliance","Maintenance cost per unit","Asset availability","MTBF","Indikator leading mengukur proses (PM compliance, backlog) dan memprediksi hasil; availability dan MTBF adalah hasil.",9],
["Which of the following is a lagging indicator?","Maintenance cost","Backlog in weeks","PM compliance","Percentage of planned work","Lagging = hasil, contoh biaya perawatan dan availability.",9],
["Gulati notes that whether an indicator is leading or lagging depends on:","Where in the process the indicator is applied","Whether it is financial or non-financial","How frequently it is reported","Whether it is set by management or by SMRP","Lagging di satu proses dapat menjadi leading untuk proses berikutnya.",9],
["The four perspectives of the balanced scorecard are:","Customer, financial, internal processes, and learning and growth","Customer, financial, safety and environment, and asset performance","Financial, operational, environmental, and social","Quality, cost, delivery, and people development","Balanced scorecard (Kaplan & Norton) memakai empat perspektif tersebut.",9],
["According to Gulati, the primary objective of metrics is to:","Change behavior so that people do the right things","Determine the health of the assets being monitored","Provide data for benchmarking with other companies","Justify the maintenance budget to management","Tujuan utama metrik adalah mengubah perilaku; tujuan sekunder menilai kesehatan proses/aset.",9],
["A successful performance measurement system should comprise:","A balanced set of a limited vital few metrics","A comprehensive set covering each maintenance activity","Mainly financial metrics reviewed by management","Metrics chosen independently by each department","Sistem pengukuran efektif memakai sedikit metrik vital yang seimbang dan selaras dengan tujuan.",9],
["Which advice about metrics does Gulati give?","Manage the work, not the metric","Set targets slightly below current performance","Review metrics mainly at the end of each year","Respond quickly to each fluctuation in the data","Metrik adalah hasil pekerjaan; kelola pekerjaannya, dengarkan sinyal bukan noise.",9],
["Benchmarking is best described as:","Identifying, sharing, and using best practices to improve a process","Comparing your key metric values with those of leading competitors","Visiting top-performing plants to observe their operations","Adopting a leading company's procedures without changes","Benchmarking fokus pada cara meningkatkan proses; best practice harus disesuaikan dengan budaya organisasi.",9],
["What is the major disadvantage of internal benchmarking?","It is unlikely to produce breakthrough improvements","Data is difficult to collect and compare","Employee skills and culture differ too much","It requires a nondisclosure agreement","Internal benchmarking mudah tetapi jarang menghasilkan terobosan.",9],
["Benchmarking against the leader in a specific process, regardless of industry, is called:","Best practices benchmarking","Similar industry benchmarking","Competitive benchmarking","Internal benchmarking","Best practices benchmarking mencari pemimpin terbaik pada proses tertentu.",9],
["What is the first step of Gulati's recommended benchmarking process?","Conduct an internal analysis","Identify benchmarking partners","Set objectives and define the scope","Compare data with available benchmarks","Urutan: analisis internal → bandingkan data → identifikasi gap → tujuan & ruang lingkup → partner.",9],
["Under the benchmarking code of conduct, discussing prices with a competitor should be avoided mainly because:","It could lead to allegations of price-fixing","It breaches the golden rule of benchmarking","Price data is rarely accurate","It reduces the openness of the exchange","Prinsip 'keep it legal': hindari diskusi yang dapat dianggap price-fixing atau market rigging.",9],
["Which organization has developed standardized definitions for maintenance and reliability metrics?","SMRP","ISO","ASQ","APQC","SMRP Best Practices Committee membakukan definisi metrik M&R (sekitar 200 istilah).",9],
["Which element is NOT part of the SMRP metric description template?","Recommended target value","Formula","Qualifications","Sample calculation","Template SMRP: title, definition, objectives, formula, component definitions, qualifications, sample calculation.",9],
["[Calc] A vibration program costs $200,000 and saves $500,000 per year. The simple first-year net ROI is:","150%","250%","40%","60%","Rumus:\n  ROI = (Manfaat − Biaya) ÷ Biaya × 100%\n\nDiketahui:\n  Biaya = $200.000\n  Penghematan tahun pertama = $500.000\n\nLangkah:\n1) Manfaat bersih = 500.000 − 200.000 = 300.000\n2) 300.000 ÷ 200.000 = 1,5\n3) 1,5 × 100% = 150%\n\nJebakan: 500.000 ÷ 200.000 = 250% adalah rasio manfaat/biaya, bukan ROI bersih.",9],
["[Calc] A reliability project costs $120,000 and saves $40,000 per year. The simple payback period is:","3 years","4 years","2.5 years","3.3 years","Rumus:\n  Payback sederhana = Investasi awal ÷ Penghematan per tahun\n\nDiketahui:\n  Investasi = $120.000\n  Penghematan = $40.000 per tahun\n\nLangkah:\n1) 120.000 ÷ 40.000 = 3\n\nJawaban: 3 tahun. Payback sederhana tidak memperhitungkan nilai waktu uang.",1],
["Net present value (NPV) of a project is:","The discounted value of cash inflows minus the discounted value of outflows","The sum of future savings minus the initial investment","The discount rate at which inflows equal outflows","The time needed for the discounted savings to repay the original investment","NPV memakai nilai terdiskonto. Tingkat diskonto saat NPV = 0 adalah IRR; waktu balik modal terdiskonto adalah discounted payback.",13],
["[Calc] What is the present value of $1,000 received one year from now at a 10% discount rate?","$909","$900","$1,100","$990","Rumus:\n  PV = FV ÷ (1 + i)^n\n\nDiketahui:\n  FV = $1.000, i = 10% = 0,10, n = 1 tahun\n\nLangkah:\n1) (1 + 0,10)^1 = 1,10\n2) 1.000 ÷ 1,10 = 909,09\n\nJawaban: $909.\nJebakan: $900 didapat dari mengurangi 10% (1.000 × 0,9) — itu bukan diskonto.",13],
["Internal rate of return (IRR) is the discount rate at which:","NPV equals zero","Payback equals the asset life","Benefit-to-cost ratio equals two","Annual savings equal depreciation","IRR adalah tingkat diskonto saat NPV = 0.",13],
["A higher discount rate generally makes the future savings of a reliability project:","Worth less in present-value terms","Worth more in present-value terms","Unchanged in present-value terms","Worth more when inflation is high","Semakin tinggi tingkat diskonto, semakin kecil nilai sekarang arus kas masa depan.",13],
["Which life cycle phase usually has the highest cost for an industrial asset?","Operate and maintain","Design and engineering","Acquisition and installation","Decommissioning and disposal","Fase O&M biasanya 70–80% atau lebih dari total biaya siklus hidup.",6],
["Most of the maintenance costs of an asset become fixed during:","The design phase","The installation phase","The first year of operation","The first major overhaul","Sebagian besar biaya O&M ditentukan saat desain.",6],
["According to Gulati, O&M costs represent roughly what share of an asset's total life cycle cost?","About 80% or more","About 50%","About 30%","About 60%","O&M sekitar 80% atau lebih dari LCC.",6],
["Life cycle cost (LCC) analysis should include:","Acquisition, operation, maintenance, and disposal costs","Acquisition, installation, and warranty costs","Operation and maintenance costs over the design life","Acquisition cost plus the expected major overhauls and repairs","LCC mencakup seluruh biaya dari konsep hingga pembuangan.",6],
["The purchase of a new production line to increase capacity is generally classified as:","Capital expenditure (CAPEX)","Operating expense (OPEX)","Capital maintenance","Deferred maintenance","Investasi untuk kapasitas baru adalah CAPEX; capital maintenance adalah penggantian aset aus.",13],
["Routine lubrication labor is generally classified as:","Operating expense (OPEX)","Capital expenditure (CAPEX)","Capital maintenance","Project cost","Pekerjaan rutin merupakan biaya operasi.",13],
["[Calc] An asset costs $100,000, has a $10,000 salvage value and a 9-year life. Annual straight-line depreciation is:","$10,000","$11,111","$9,000","$12,222","Rumus (garis lurus):\n  Depresiasi per tahun = (Biaya aset − Nilai sisa) ÷ Umur manfaat\n\nDiketahui:\n  Biaya = $100.000, nilai sisa = $10.000, umur = 9 tahun\n\nLangkah:\n1) 100.000 − 10.000 = 90.000 (nilai yang disusutkan)\n2) 90.000 ÷ 9 = 10.000\n\nJawaban: $10.000 per tahun.\nJebakan: 100.000 ÷ 9 = $11.111 lupa mengurangi nilai sisa.",13],
["In a repair-versus-replace decision, money already spent on the old asset should:","Not influence the decision","Be added to the cost of repair","Be subtracted from the cost of replacement","Be spread over the remaining life","Biaya yang sudah terjadi (sunk cost) tidak relevan untuk keputusan masa depan.",13],
["To compare two alternatives with different service lives, a suitable method is:","Equivalent annual cost (EAC)","Simple payback period","Total purchase price comparison","Average annual maintenance cost","EAC menyetarakan biaya alternatif dengan umur berbeda per tahun.",6],
["Budgeting where every expense must be justified from scratch each period is called:","Zero-based budgeting","Incremental budgeting","Activity-based costing","Flexible budgeting","Zero-based budgeting tidak berangkat dari anggaran tahun lalu.",3],
["Comparing actual spending with the budget and explaining the differences is called:","Variance analysis","Gap analysis","Cost-benefit analysis","Sensitivity analysis","Analisis varians menjelaskan selisih anggaran vs aktual.",3],
["According to Gulati, planned work typically costs how much less than reactive work?","Two to three times less","About 10–20% less","About half as much","Five to ten times less","Pekerjaan terencana dua hingga tiga kali lebih murah daripada reaktif.",4],
["When an organization starts an M&R improvement initiative, maintenance cost typically:","May rise at first, then fall as reliability improves","Falls immediately as reactive work and overtime decline","Stays flat until the program is fully implemented","Rises permanently because of added PM work","Biaya bisa naik di awal (membangun program), lalu turun setelah keandalan meningkat.",1],
["Gulati warns that focusing only on maintenance cost reduction is usually misdirected until:","Processes have been improved through best practices","The organization has benchmarked its competitors","Maintenance staffing has been reduced","Spare parts inventory has been optimized","Biaya tidak dapat turun berkelanjutan tanpa menerapkan best practice.",1],
["Gulati states that asset utilization in a world-class facility should be above:","85%","75%","90%","95%","Utilisasi aset kelas dunia di atas 85%; 95% bisa dicapai tetapi sangat sulit.",1],
["OEE is calculated as:","Availability × performance × quality","Availability × utilization × quality","Utilization × performance × quality","Availability × reliability × quality","OEE = A × P × Q.",7],
["[Calc] Availability 90%, performance 95%, quality 99%. What is the OEE?","84.6%","85.5%","94.7%","81.2%","Rumus:\n  OEE = Availability × Performance × Quality\n\nDiketahui:\n  A = 90% = 0,90; P = 95% = 0,95; Q = 99% = 0,99\n\nLangkah:\n1) 0,90 × 0,95 = 0,855\n2) 0,855 × 0,99 = 0,8465\n3) 0,8465 × 100% ≈ 84,6%\n\nJebakan: 85,5% hanya A × P (lupa Q).",7],
["In SMRP terminology, TEEP is also called:","OEE 1","OEE 2","OEE 3","Asset utilization","SMRP: TEEP = OEE 1; OEE = OEE 2.",7],
["TEEP is calculated as:","Utilization × OEE","Availability × OEE","OEE ÷ utilization","Utilization × availability","TEEP = utilisasi × OEE, berbasis 24 jam/365 hari.",7],
["Utilization rate is defined as:","Scheduled operating time divided by total available time","Actual run time divided by the scheduled operating time of the asset","Actual output divided by design capacity","Uptime divided by uptime plus downtime","Utilisasi = waktu terjadwal operasi / total waktu kalender. Run time / scheduled time = availability.",7],
["Which statement about OEE is correct?","Reliability is not one of its three factors","It includes utilization as a fourth factor","It is the same as asset availability","It is calculated as availability plus performance plus quality","OEE = A × P × Q; reliabilitas dan utilisasi bukan faktor langsung.",7],
["Which ISO standard series addresses asset management?","ISO 55000","ISO 31000","ISO 50000","ISO 14224","ISO 55000 = manajemen aset; 31000 = risiko; 50000 = energi; 14224 = data/taksonomi.",12],
["Which standard specifies the requirements for an asset management system?","ISO 55001","ISO 55000","ISO 55002","ISO 9001","ISO 55001 memuat persyaratan; 55000 overview dan istilah; 55002 panduan penerapan.",12],
["ISO 31000 provides guidelines for:","Risk management","Asset management","Energy management","Quality management","ISO 31000 = manajemen risiko.",12],
["The ISO 50000 series relates to:","Energy management","Environmental management","Information security","Occupational health and safety","Seri ISO 50000 = manajemen energi.",12],
["ISO 14001 is related to:","Environmental management systems","Equipment reliability data","Quality management systems","Occupational health and safety","ISO 14000 = manajemen lingkungan.",12],
["ISO 14224 deals with:","Reliability and maintenance data, including equipment taxonomy","Requirements for environmental management systems and their audits","Fluid cleanliness classification","Risk-based inspection planning","ISO 14224 = taksonomi/hirarki peralatan dan data keandalan.",12],
["In asset management terms, an asset is:","An item or entity that has potential or actual value to an organization","A physical item that is recorded in the fixed asset register of the company","Equipment whose replacement cost exceeds a set threshold","An item that requires preventive maintenance","Aset memiliki nilai potensial atau aktual, berwujud maupun tidak berwujud.",1],
["Gulati defines asset management as:","An organizational process that maximizes value from an asset during its life","The process of keeping physical assets running at the lowest possible annual cost","The process of recording and depreciating fixed assets","The selection and purchase of assets for a project","Manajemen aset memaksimalkan nilai aset sepanjang umurnya.",1],
["A Strategic Asset Management Plan (SAMP) is used to:","Translate organizational objectives into asset management objectives","Schedule maintenance work for the coming year","Define the detailed maintenance tasks and their intervals for each asset","Record the asset register and its hierarchy","SAMP menghubungkan tujuan organisasi dengan tujuan dan pendekatan manajemen aset.",12],
["'Line of sight' in asset management means:","Daily activities are clearly linked to organizational objectives","Managers regularly observe work on the shop floor","Asset data is visible to each employee in the plant","Critical assets are inspected visually each shift","Line of sight = keterkaitan aktivitas lapangan dengan tujuan organisasi.",12],
["A stakeholder is:","A person or organization that can affect, be affected by, or believe it is affected by a decision","A person or organization that owns shares in the company and therefore has a financial interest in it","A person responsible for approving a project's budget","A person or team that performs the work of a project","Stakeholder juga disebut interested party.",2],
["Risk is commonly expressed as a combination of:","Likelihood and consequence","Severity and detection","Hazard and exposure time","Frequency and cost of repair","Risiko = kemungkinan × konsekuensi.",13],
["Purchasing insurance for a major asset is an example of which risk treatment?","Risk transfer","Risk reduction","Risk acceptance","Risk avoidance","Asuransi memindahkan dampak finansial risiko ke pihak lain.",13],
["A risk matrix is mainly used to:","Rank risks by likelihood and consequence","Calculate the cost of each risk","Assign owners to each risk","Select the risk treatment method","Matriks risiko membantu memprioritaskan risiko.",13],
["The primary purpose of a business case for a reliability investment is to:","Justify the investment by comparing benefits, costs, and risks","Describe the technical scope and specifications","Define the implementation schedule, resources, and responsibilities","Obtain the commitment of affected employees","Business case membandingkan manfaat, biaya, dan risiko untuk keputusan investasi.",13],
["When presenting a reliability improvement to senior management, benefits are best expressed in terms of:","Business value, such as savings, ROI, and risk reduction","Technical improvements, such as MTBF and vibration levels","Maintenance activity, such as PMs completed","Industry benchmarks, such as world-class OEE","Manajemen memutuskan berdasarkan dampak bisnis/finansial.",13],
["Gulati describes the new paradigm of maintenance as:","Capacity assurance","Cost avoidance","Asset preservation","Breakdown prevention","Paradigma baru: maintenance = capacity assurance.",3],
["Gap analysis compares:","Current state with desired future state","Planned with actual labor hours","Budgeted with actual cost","Leading with lagging indicators","Gap analysis mengidentifikasi selisih kondisi saat ini dan target.",9],
["The Deming cycle consists of:","Plan, do, check, act","Define, measure, analyze, improve, control","Plan, schedule, execute, review","Identify, analyze, act, verify","PDCA adalah siklus perbaikan berkelanjutan; DMAIC adalah metode Six Sigma.",11],
["The triple bottom line of sustainability refers to:","People, planet, and profit","Safety, quality, and cost","Economy, energy, and environment","Customers, employees, and shareholders","Triple bottom line: sosial, lingkungan, ekonomi.",13],
["Repairing compressed air leaks found with ultrasound mainly supports:","Energy management","Process safety management","Inventory management","Quality management","Mengatasi kebocoran udara tekan menghemat energi.",13],
["Which statement about safety and reliability is most accurate?","Reliable plants tend to be safer because they perform less emergency work","Safety improves mainly when PM frequency is increased on critical assets","Reliability and safety goals usually conflict","Safety depends mostly on PPE rather than reliability","Pekerjaan reaktif/darurat memiliki risiko keselamatan lebih tinggi.",13],
["NFPA 70E is a standard related to:","Electrical safety in the workplace","Fire protection system maintenance","Process safety management","Machine guarding","NFPA 70E mengatur keselamatan listrik termasuk arc flash.",13],
["The OSHA standard for control of hazardous energy is commonly called:","Lockout/tagout","Process safety management","Permit to work","Management of change","LOTO (29 CFR 1910.147) mengendalikan energi berbahaya.",13],
["Which work is generally best suited to be outsourced?","Specialized, infrequent work requiring special equipment","Routine PM work on critical assets","Planning and scheduling of maintenance work, including PM routes","Reliability analysis of bad actors","Outsourcing tepat untuk pekerjaan khusus dan jarang; kompetensi inti sebaiknya dipertahankan.",10],
["Which contract type places the most cost risk on the contractor?","Firm fixed price","Time and materials","Cost plus fixed fee","Unit rate","Pada fixed price, kontraktor menanggung risiko biaya berlebih.",13],
["Gulati notes that a flexible workforce model through shared services and outsourcing helps to turn:","A fixed cost into a variable cost","A variable cost into a fixed cost","An operating cost into a capital cost","A direct cost into an overhead cost","Shared services/outsourcing mengubah biaya tetap menjadi variabel.",10],
["The total cost of maintenance plus lost production is usually minimized when:","Proactive work is balanced against the cost of failures","PM frequency is maximized on assets to prevent failures","Maintenance spending is kept at a minimum","Non-critical assets are run to failure","Ada titik optimum antara biaya pencegahan dan biaya kegagalan.",3],
["The cost of lost production caused by equipment problems is often called:","Cost of unreliability","Opportunity cost of capital","Cost of quality","Sunk cost","Biaya ketidakandalan sering jauh lebih besar dari biaya perawatan.",6],
["What percentage of maintenance work does Gulati recommend should be proactive?","85% or more","70% or more","60% or more","95% or more","Proactive work sebaiknya 85% atau lebih.",1],
["Gulati estimates the annual cost of keeping a part in the storeroom at about:","20–25% of its value","5–10% of its value","30–40% of its value","10–15% of its value","Biaya penyimpanan inventori sekitar 20–25% dari nilai per tahun.",5],
["Gulati's benchmark for the training budget is about:","5%","1%","10%","3%","Benchmark anggaran pelatihan (biaya dan jam per karyawan) sekitar 5%.",10],
["Hoshin kanri (policy deployment) is used to:","Cascade strategic goals throughout the organization","Level the production schedule","Prioritize improvement projects by cost","Standardize work methods and visual controls on the shop floor","Hoshin kanri menyelaraskan tujuan strategis ke semua level.",2],
["Strategic plans typically cover a horizon of:","3–5 years or more","1 year","1 quarter","10–20 years","Perencanaan strategis berjangka panjang; rencana tahunan bersifat taktis.",2],
["The strategic framework described by Gulati follows which sequence?","Vision, mission, goals, action plans","Mission, vision, action plans, goals","Goals, vision, mission, action plans","Vision, goals, mission, action plans","Visi diterjemahkan ke misi, tujuan, lalu rencana aksi.",2],
["Which statement about changing to a reliability culture is true?","It takes many years and depends on time, not just resources","It can be achieved within a year if enough resources are made available","It is mainly achieved by implementing a new CMMS","It is complete once the RCM analysis is finished","Perubahan budaya adalah perjalanan bertahun-tahun.",2],
["Which is a general benefit of standards cited by Gulati?","Interchangeability of parts and systems","Greater design freedom for suppliers","Fewer procedures to document","Lower need for training","Standar memberi keselamatan, kualitas, reliabilitas, interchangeability, dan konsistensi.",12],
["Which are examples of standards development organizations?","ANSI, ASTM, IEC, and IEEE","SMRP, APQC, ASQ, and AIAG","OSHA, EPA, NFPA, and SMRP","ISO, SMRP, PMI, and ASQ","Contoh lembaga penyusun standar: ANSI, ASTM, BSI, CSA, IEC, IEEE, ISO.",12],
["Gulati recommends that maintenance metrics be:","Displayed in common areas so everyone understands them","Reviewed mainly by managers to avoid confusion","Reported mainly to finance each quarter","Kept confidential to prevent manipulation","Metrik harus disebarkan sampai shop floor agar membangun pemahaman dan kepemilikan.",9],
["For an accurate maintenance material cost as % of RAV, the material cost should include:","Storeroom parts, contractor-supplied materials, and capital maintenance","Storeroom issues to work orders","Storeroom issues plus emergency purchases","Purchased parts and materials, excluding capital maintenance projects","Agar perbandingan akurat, semua material perawatan harus dimasukkan.",1],
["According to APQC, a main barrier to adopting best practices is a lack of:","Knowledge about current best practices","Benchmarking partners","Management reporting systems","Standardized metrics","Tiga hambatan: kurang pengetahuan, kurang motivasi, kurang keterampilan untuk berubah.",1],
["Which SMRP pillar covers strategic planning, budgeting, KPIs, and regulatory compliance?","Business and management","Organization and leadership","Work management","Manufacturing process reliability","Pilar 1 SMRP: Business & Management.",1],
["Improved reliability raises return on net assets mainly because:","More output is produced from the same asset base","Maintenance costs are capitalized","Assets are depreciated over a longer period, lowering annual cost","Fewer spare parts are kept in stock","Keandalan meningkatkan output tanpa menambah aset.",9],
["A maintenance assessment against best practices is primarily used to:","Identify gaps and set improvement priorities","Determine the maintenance budget for next year","Rank technicians by performance","Verify compliance with regulations","Assessment menentukan posisi saat ini terhadap best practice.",3],
["[Calc] Annual maintenance cost is $6.3 million and the plant's RAV is $180 million. Maintenance cost as a percentage of RAV is:","3.5%","2.9%","4.2%","0.35%","Rumus:\n  Biaya perawatan % RAV = Biaya perawatan tahunan ÷ RAV × 100%\n\nDiketahui:\n  Biaya = $6,3 juta, RAV = $180 juta\n\nLangkah:\n1) 6,3 ÷ 180 = 0,035\n2) 0,035 × 100% = 3,5%\n\nJebakan: 0,35% salah menggeser koma.",1],
["[Calc] A project costs $100,000 and saves $50,000 per year for 3 years. At a 10% discount rate, its NPV is about:","$24,300","$50,000","$13,600","$36,400","Rumus:\n  NPV = Σ [Arus kas tahun t ÷ (1 + i)^t] − Investasi awal\n\nDiketahui:\n  Investasi = $100.000; arus kas = $50.000/tahun selama 3 tahun; i = 10%\n\nLangkah:\n1) Tahun 1: 50.000 ÷ 1,10 = 45.455\n2) Tahun 2: 50.000 ÷ 1,21 = 41.322\n3) Tahun 3: 50.000 ÷ 1,331 = 37.566\n4) Total PV = 45.455 + 41.322 + 37.566 = 124.343\n5) NPV = 124.343 − 100.000 = 24.343\n\nJawaban: ≈ $24.300.\nJebakan: 150.000 − 100.000 = $50.000 mengabaikan diskonto.",13],
["[Calc] A plant spends $2.4 million per year on maintenance and produces 800,000 units. Maintenance cost per unit is:","$3.00","$0.33","$3.33","$2.40","Rumus:\n  Biaya perawatan per unit = Total biaya perawatan ÷ Jumlah unit diproduksi\n\nDiketahui:\n  Biaya = $2.400.000, produksi = 800.000 unit\n\nLangkah:\n1) 2.400.000 ÷ 800.000 = 3\n\nJawaban: $3,00 per unit. Jebakan: 800.000 ÷ 2.400.000 = 0,33 membalik rumus.",9],
["[Calc] A reliability project has discounted benefits of $450,000 and discounted costs of $300,000. Its benefit-to-cost ratio is:","1.5","0.67","2.5","1.33","Rumus:\n  Rasio manfaat-biaya (B/C) = PV manfaat ÷ PV biaya\n\nDiketahui:\n  PV manfaat = $450.000, PV biaya = $300.000\n\nLangkah:\n1) 450.000 ÷ 300.000 = 1,5\n\nInterpretasi: B/C > 1 berarti layak. Jebakan: 300.000 ÷ 450.000 = 0,67 membalik rumus.",13],
["[Calc] A line produces 120 units per hour with a contribution margin of $50 per unit. A 16-hour breakdown costs about how much in lost margin?","$96,000","$9,600","$48,000","$192,000","Rumus:\n  Kerugian margin = Laju produksi × Margin per unit × Jam downtime\n\nDiketahui:\n  120 unit/jam, $50/unit, 16 jam\n\nLangkah:\n1) Margin per jam = 120 × 50 = $6.000\n2) 6.000 × 16 = $96.000\n\nJawaban: $96.000 (belum termasuk biaya perbaikan).",6],
["Which is one of the four fundamentals of asset management described in ISO 55000?","Assurance","Availability","Accountability","Affordability","Empat fundamental ISO 55000: value, alignment, leadership, assurance.",12],
["The project 'triple constraint' refers to:","Scope, time, and cost","Scope, quality, and risk","Cost, risk, and resources","Time, quality, and safety","Perubahan salah satu (scope, jadwal, biaya) mempengaruhi yang lain; kualitas berada di tengahnya.",13],
["A project charter mainly serves to:","Formally authorize the project and the project manager","List the detailed tasks and durations of the project","Record the risks, owners, and planned responses","Define the communication schedule for stakeholders","Charter mengesahkan proyek; detail tugas = WBS/jadwal; risiko = risk register.",13],
["A risk register is:","A record of identified risks with ratings, owners, and responses","A matrix that plots each risk's likelihood against its consequence","A report of incidents that have already occurred","A list of insurance policies held by the company","Risk register mendokumentasikan risiko dan penanganannya; matriks hanya alat penilaian.",13],
["A digital twin is best described as:","A virtual model of a physical asset updated with its real operating data","A backup copy of the CMMS database that is stored at another site","A 3D drawing of an asset used during the design phase","A spare asset kept on standby to replace a failed unit","Digital twin = representasi virtual yang terus diperbarui data aktual (Industry 4.0).",13],
["The Industrial Internet of Things (IIoT) mainly enables:","Connected sensors that collect and share asset data continuously","Operators to control equipment from mobile phones","Automatic generation of job plans and parts lists for each work order","Replacement of planners with scheduling software","IIoT menghubungkan sensor untuk pemantauan kondisi dan analitik.",13],
["Configuration management ensures that:","Requirements, design, documents, and the physical asset stay consistent","Spare parts are stored and issued according to the asset's configuration","CMMS settings are the same across all sites","Each asset is configured for maximum production rate","Configuration management menjaga konsistensi dokumen dengan kondisi fisik aset.",13],
["Risk-based inspection (API 580/581) prioritizes inspection by:","Likelihood and consequence of failure","Age and operating hours of the equipment","Inspection cost of each item","Time since the last inspection","RBI memfokuskan inspeksi pada risiko tertinggi.",13],
["In ISO management systems, corrective action is taken to:","Eliminate the cause of a nonconformity to prevent recurrence","Fix the immediate effect of a nonconformity as quickly as possible","Record the nonconformity for the next audit","Assign responsibility for the nonconformity","Correction memperbaiki dampak; corrective action menghilangkan penyebab.",12],
["An internal audit of an ISO 55001 asset management system mainly determines whether the system:","Conforms to requirements and is effectively implemented","Achieves a lower maintenance cost than the previous year","Uses the latest CMMS technology","Meets the benchmarks of competitors","Audit internal memeriksa kesesuaian dan efektivitas penerapan.",12],
["In ISO management system standards, management review is performed by:","Top management at planned intervals","The internal audit team after each audit","The certification body each year","Department supervisors each week","Manajemen puncak meninjau kesesuaian, kecukupan, dan efektivitas sistem.",12],
["In ISO 50001, an energy baseline is:","A reference used to compare energy performance over time","The minimum energy the plant needs to run at full production","The energy rating on equipment nameplates","The target energy reduction for the year","Baseline menjadi titik pembanding kinerja energi.",12],
["Which is a leading safety indicator?","Near-miss reporting rate","Lost-time injury rate","Recordable injury rate","Workers' compensation cost","Indikator leading mengukur aktivitas pencegahan; tingkat cedera adalah lagging.",13],
["ISO 55001 follows the same high-level structure as other ISO management systems, which is based on the:","Plan-do-check-act cycle","DMAIC cycle","Define-design-verify cycle","Identify-plan-schedule cycle","Standar sistem manajemen ISO memakai struktur PDCA.",12],
["The 'value' fundamental of ISO 55000 means that assets exist to:","Provide value to the organization and its stakeholders","Be maintained in as-new condition throughout their entire life","Achieve the highest possible availability","Minimize the maintenance budget each year","Nilai ditentukan organisasi dan pemangku kepentingan, bukan sekadar kondisi aset.",12]

["[Calc] Planned production time is 480 minutes and downtime is 48 minutes. What is availability?","90%","91%","89%","10%","Rumus:\n  Availability (OEE) = Run time ÷ Planned production time\n  Run time = Planned production time − Downtime\n\nDiketahui:\n  Planned time = 480 menit, downtime = 48 menit\n\nLangkah:\n1) Run time = 480 − 48 = 432 menit\n2) 432 ÷ 480 = 0,90\n\nJawaban: 90%.",7],
["[Calc] Ideal cycle time is 1 minute; 400 units were produced in 432 minutes of run time. The performance rate is:","92.6%","83.3%","90.0%","108%","Rumus:\n  Performance = (Ideal cycle time × Total count) ÷ Run time\n\nDiketahui:\n  Ideal cycle time = 1 menit/unit, total count = 400 unit, run time = 432 menit\n\nLangkah:\n1) Waktu ideal = 1 × 400 = 400 menit\n2) 400 ÷ 432 = 0,926\n\nJawaban: 92,6%.\nJebakan: 400 ÷ 480 = 83,3% memakai planned time, padahal downtime sudah dihitung di availability.",7],
["[Calc] Of 400 units produced, 8 were defective. The quality rate is:","98%","97%","92%","99%","Rumus:\n  Quality = Good count ÷ Total count\n  Good count = Total count − Defect count\n\nDiketahui:\n  Total = 400 unit, cacat = 8 unit\n\nLangkah:\n1) Good count = 400 − 8 = 392\n2) 392 ÷ 400 = 0,98\n\nJawaban: 98%.",7],

["Process capability index Cp is calculated as:","(USL − LSL) / 6σ","(USL − LSL) / 3σ","(USL − mean) / 3σ","(mean − LSL) / 6σ","Cp membandingkan lebar spesifikasi dengan sebaran proses 6σ.",11],
["[Calc] USL = 10.6, LSL = 9.4, σ = 0.1. What is Cp?","2.0","1.0","4.0","1.2","Rumus:\n  Cp = (USL − LSL) ÷ 6σ\n\nDiketahui:\n  USL = 10,6; LSL = 9,4; σ = 0,1\n\nLangkah:\n1) Lebar spesifikasi = 10,6 − 9,4 = 1,2\n2) Lebar proses = 6 × 0,1 = 0,6\n3) Cp = 1,2 ÷ 0,6 = 2,0\n\nJebakan: membagi dengan 3σ menghasilkan 4,0.",11],
["[Calc] USL = 10.6, LSL = 9.4, mean = 10.3, σ = 0.1. What is Cpk?","1.0","2.0","3.0","1.5","Rumus:\n  Cpk = min[(USL − μ) ÷ 3σ ; (μ − LSL) ÷ 3σ]\n\nDiketahui:\n  USL = 10,6; LSL = 9,4; μ = 10,3; σ = 0,1 → 3σ = 0,3\n\nLangkah:\n1) Sisi atas: (10,6 − 10,3) ÷ 0,3 = 0,3 ÷ 0,3 = 1,0\n2) Sisi bawah: (10,3 − 9,4) ÷ 0,3 = 0,9 ÷ 0,3 = 3,0\n3) Ambil yang terkecil: Cpk = 1,0\n\nCatatan: Cp = 2,0 tetapi Cpk = 1,0 karena rata-rata proses bergeser mendekati USL.",11],

["The first step of autonomous maintenance in TPM is usually:","Initial cleaning and inspection of the equipment","Training operators in basic lubrication tasks","Developing standards for cleaning and lubrication","Eliminating sources of contamination","Langkah awal AM adalah pembersihan awal (cleaning is inspecting) untuk menemukan abnormalitas; eliminasi sumber kontaminasi adalah langkah berikutnya.",7],
["[Calc] Planned time is 480 minutes, downtime 60 minutes, ideal cycle time 0.5 minute, total count 760, and good count 741. The OEE is about:","77.2%","79.2%","85.3%","74.1%","Rumus:\n  A = Run time ÷ Planned time\n  P = (Ideal cycle time × Total count) ÷ Run time\n  Q = Good count ÷ Total count\n  OEE = A × P × Q\n\nLangkah:\n1) Run time = 480 − 60 = 420 menit → A = 420 ÷ 480 = 0,875\n2) P = (0,5 × 760) ÷ 420 = 380 ÷ 420 = 0,905\n3) Q = 741 ÷ 760 = 0,975\n4) OEE = 0,875 × 0,905 × 0,975 = 0,772\n\nCara cepat: OEE = (Good count × Ideal cycle time) ÷ Planned time = (741 × 0,5) ÷ 480 = 370,5 ÷ 480 = 77,2%.\nJebakan: 79,2% = A × P saja.",7],
["[Calc] An asset has an OEE of 75% and a utilization of 80%. Its TEEP is:","60%","75%","94%","55%","Rumus:\n  TEEP = Utilization × OEE\n\nDiketahui:\n  OEE = 75% = 0,75; Utilization = 80% = 0,80\n\nLangkah:\n1) 0,80 × 0,75 = 0,60\n\nJawaban: 60%. TEEP selalu ≤ OEE karena memakai basis 24 jam × 365 hari.",7],
["[Calc] An inspection found 50 defects in 2,000 units, each with 5 defect opportunities. The DPMO is:","5,000","25,000","2,500","10,000","Rumus:\n  DPMO = Jumlah cacat ÷ (Jumlah unit × Peluang cacat per unit) × 1.000.000\n\nDiketahui:\n  Cacat = 50, unit = 2.000, peluang = 5 per unit\n\nLangkah:\n1) Total peluang = 2.000 × 5 = 10.000\n2) 50 ÷ 10.000 = 0,005\n3) 0,005 × 1.000.000 = 5.000\n\nJawaban: 5.000 DPMO.\nJebakan: 50 ÷ 2.000 × 1.000.000 = 25.000 lupa faktor peluang (itu DPPM).",11],
["[Calc] A shift is 8 hours with two 15-minute breaks and a 30-minute lunch. Customer demand is 700 units per shift. Takt time is:","36 seconds","41 seconds","30 seconds","45 seconds","Rumus:\n  Takt time = Waktu produksi tersedia ÷ Permintaan\n  Waktu tersedia = Waktu shift − Istirahat terencana\n\nDiketahui:\n  Shift 8 jam = 480 menit; istirahat 15 + 15 + 30 = 60 menit; permintaan 700 unit\n\nLangkah:\n1) Waktu tersedia = 480 − 60 = 420 menit\n2) 420 ÷ 700 = 0,6 menit per unit\n3) 0,6 × 60 = 36 detik\n\nJebakan: 480 ÷ 700 = 0,686 menit ≈ 41 detik lupa mengurangi istirahat.",11],
["[Calc] USL = 50, LSL = 40, process mean = 44, σ = 1.5. The Cpk is about:","0.89","1.11","1.33","2.00","Rumus:\n  Cp = (USL − LSL) ÷ 6σ\n  Cpk = min[(USL − μ) ÷ 3σ ; (μ − LSL) ÷ 3σ]\n\nDiketahui:\n  USL = 50; LSL = 40; μ = 44; σ = 1,5 → 3σ = 4,5; 6σ = 9\n\nLangkah:\n1) Sisi atas: (50 − 44) ÷ 4,5 = 6 ÷ 4,5 = 1,33\n2) Sisi bawah: (44 − 40) ÷ 4,5 = 4 ÷ 4,5 = 0,89\n3) Cpk = nilai terkecil = 0,89\n\nPembanding: Cp = 10 ÷ 9 = 1,11. Cpk < Cp karena rata-rata lebih dekat ke LSL.",11],
["The elements of standard work are:","Takt time, work sequence, and standard work-in-process","Cycle time, operator count, and in-process quality checks","Work instructions, tools, and safety rules","Takt time, batch size, and changeover time","Standard work (Lean) terdiri dari takt time, urutan kerja, dan standar WIP.",11],
["A spaghetti diagram is used mainly to show:","The movement of people or material through a work area","The relationship between causes and effects","The flow of information and approvals between departments","The sequence of tasks on the critical path","Spaghetti diagram menyoroti waste gerakan dan transportasi.",11],
["A kaizen event (kaizen blitz) is:","A focused team improvement effort lasting a few days","A year-long Six Sigma project led by a black belt","A daily meeting to review production problems","An annual award for the best improvement idea","Kaizen event biasanya 3–5 hari dengan tim lintas fungsi.",11],
["Moving parts back and forth between distant workstations is which Lean waste?","Transportation","Motion","Waiting","Inventory","Transportation = perpindahan material; motion = gerakan orang.",11],
["An operator walking repeatedly to fetch tools from a distant cabinet is which Lean waste?","Motion","Transportation","Overprocessing","Waiting","Motion = gerakan orang yang tidak menambah nilai.",11],
["A pull system means that:","Production is triggered by actual downstream consumption","Production follows a forecast-driven master schedule each week","Material is pushed to the next step when ready","Inventory is built up ahead of seasonal demand","Pull (kanban) memproduksi berdasarkan konsumsi aktual.",11],
["One-piece flow means:","Moving products one at a time through the process steps","Producing a single product type on each line for the whole shift","Using one operator for the entire line","Inspecting one piece from each batch","One-piece flow mengurangi WIP dan lead time.",11],
["Which statement about a process in statistical control is true?","It can still be incapable of meeting specifications","It always meets customer specifications as well","It has no variation at all","It has a Cpk of at least 1.33","Stabil (in control) berbeda dengan mampu (capable).",11],
["In a Gage R&R study, repeatability refers to variation:","When the same appraiser measures the same part repeatedly","Between different appraisers measuring the same part","Between different parts in the sample","Between measurements taken on different days","Repeatability = variasi alat; reproducibility = variasi antar appraiser.",11],
["DMADV is used mainly to:","Design a new process or product","Improve an existing process","Control a process after improvement","Analyze the root cause of defects","DMADV (Define, Measure, Analyze, Design, Verify) untuk desain baru; DMAIC untuk proses yang ada.",11],
["In Six Sigma, a black belt typically:","Leads improvement projects, often full-time","Sponsors projects and provides resources","Supports projects part-time within their job","Sets the organization's quality strategy","Champion = sponsor; green belt = paruh waktu; master black belt = pembina.",11],
["Integrity operating windows (IOWs) are:","Limits on process variables that, if exceeded, can damage equipment integrity","Time windows in which maintenance is permitted on running process equipment","Inspection ports used to view the inside of process vessels","Control chart limits used to monitor product quality","IOW menetapkan batas variabel proses agar degradasi peralatan terkendali.",13],
["Layers of protection analysis (LOPA) is used to:","Evaluate whether independent protection layers reduce risk enough","Identify process deviations by applying guide words to each node","Rank failure modes by their risk priority number","Calculate the reliability of a series system","LOPA adalah metode semi-kuantitatif setelah HAZOP.",13],
["The standard for safety instrumented systems in the process industry is:","IEC 61511","IEC 60812","ISO 14224","API 580","IEC 61511 mengatur SIS dan SIL; IEC 60812 = FMEA.",13],
["Which OSHA PSM element covers inspection and testing of process equipment?","Mechanical integrity","Process hazard analysis","Management of change","Operating procedures","Mechanical integrity mencakup inspeksi, pengujian, dan perawatan peralatan proses.",13]

["Reliability is defined as the probability that an asset will:","Perform its required function for a stated period under stated conditions","Be in an operable state when called upon at a random point in time","Be restored to operation within a specified time after failure","Operate at its design capacity during scheduled production time","Reliabilitas = probabilitas berfungsi pada periode dan kondisi tertentu. Opsi kedua = availability; ketiga = maintainability.",6],
["The reliability of an asset is best measured by:","MTBF","MTTR","Availability","PM compliance","MTBF = ukuran reliabilitas; MTTR = maintainability.",6],
["Maintainability is primarily measured by:","MTTR","MTBF","Availability","Wrench time","Maintainability = kemudahan perawatan, diukur dengan MTTR.",6],
["MTBF is calculated as:","Total operating time ÷ number of failures","Number of failures ÷ total operating time","Total downtime ÷ number of failures","Total calendar time ÷ number of PMs","MTBF = waktu operasi / jumlah kegagalan. Kebalikannya adalah failure rate.",6],
["[Calc] A pump operated 8,760 hours and failed 4 times. What is the MTBF?","2,190 hours","1,752 hours","2,920 hours","4,380 hours","Rumus:\n  MTBF = Total waktu operasi ÷ Jumlah kegagalan\n\nDiketahui:\n  Waktu operasi = 8.760 jam, kegagalan = 4\n\nLangkah:\n1) 8.760 ÷ 4 = 2.190\n\nJawaban: 2.190 jam.",6],
["[Calc] The failure rate (λ) of an asset with an MTBF of 500 hours is:","0.002 failures per hour","0.005 failures per hour","0.02 failures per hour","0.0005 failures per hour","Rumus:\n  λ (failure rate) = 1 ÷ MTBF\n\nDiketahui:\n  MTBF = 500 jam\n\nLangkah:\n1) 1 ÷ 500 = 0,002\n\nJawaban: 0,002 kegagalan per jam (= 2 kegagalan per 1.000 jam).",6],
["[Calc] With a constant failure rate and an MTBF of 1,000 hours, the reliability for a 100-hour mission is about:","90.5%","90.0%","99.0%","95.1%","Rumus (laju kegagalan konstan / eksponensial):\n  R(t) = e^(−t ÷ MTBF) = e^(−λt)\n\nDiketahui:\n  t = 100 jam, MTBF = 1.000 jam\n\nLangkah:\n1) t ÷ MTBF = 100 ÷ 1.000 = 0,1\n2) e^(−0,1) = 0,9048\n\nJawaban: ≈ 90,5%.\nJebakan: 1 − 0,1 = 90,0% adalah pendekatan linear, bukan eksponensial.",6],
["[Calc] For an exponential distribution, reliability at a time equal to the MTBF is about:","36.8%","50.0%","63.2%","13.5%","Rumus:\n  R(t) = e^(−t ÷ MTBF)\n\nLangkah:\n1) Jika t = MTBF, maka t ÷ MTBF = 1\n2) R = e^(−1) = 0,368\n\nJawaban: 36,8%. Artinya hanya ±37% unit yang masih bertahan pada t = MTBF; 63,2% sudah gagal.",6],
["Inherent availability (Ai) is calculated as:","MTBF ÷ (MTBF + MTTR)","MTBF ÷ (MTBF + MDT)","MTTR ÷ (MTBF + MTTR)","MTBM ÷ (MTBM + MDT)","Ai hanya memperhitungkan waktu perbaikan aktif korektif; MDT dipakai untuk Ao.",6],
["[Calc] MTBF = 950 hours and MTTR = 50 hours. What is inherent availability?","95%","94.7%","90%","5%","Rumus:\n  Ai = MTBF ÷ (MTBF + MTTR)\n\nDiketahui:\n  MTBF = 950 jam, MTTR = 50 jam\n\nLangkah:\n1) MTBF + MTTR = 950 + 50 = 1.000\n2) 950 ÷ 1.000 = 0,95\n\nJawaban: 95%.\nJebakan: 1 − 50/950 = 94,7% memakai pembagi yang salah.",6],
["Operational availability (Ao) differs from inherent availability because Ao includes:","Logistics and administrative delays in total downtime","Active corrective repair time","Planned production losses when demand is lower than capacity","Quality and speed losses during operation","Ao memakai mean downtime termasuk delay logistik dan administratif.",6],
["Achieved availability (Aa) considers which downtime?","Active corrective and preventive maintenance time","Corrective maintenance time","Total downtime including logistics delays","Preventive maintenance time plus scheduled shutdowns","Aa memasukkan CM dan PM aktif, tanpa delay logistik.",6],
["[Calc] In a 720-hour month, an asset was down 36 hours. What was its availability?","95%","94.7%","96%","90%","Rumus:\n  Availability = Uptime ÷ (Uptime + Downtime)\n\nDiketahui:\n  Total waktu = 720 jam, downtime = 36 jam\n\nLangkah:\n1) Uptime = 720 − 36 = 684 jam\n2) 684 ÷ 720 = 0,95\n\nJawaban: 95%.",6],
["Gulati states that availability is a function of:","Uptime and downtime","MTBF and failure rate","MTTR and repair cost","Failure rate","Availability = uptime / (uptime + downtime).",6],
["[Calc] Two components with reliabilities of 0.90 and 0.95 are in series. System reliability is:","0.855","0.925","0.995","0.900","Rumus (sistem seri):\n  Rs = R1 × R2 × … × Rn\n\nDiketahui:\n  R1 = 0,90; R2 = 0,95\n\nLangkah:\n1) 0,90 × 0,95 = 0,855\n\nJawaban: 0,855. Sistem seri selalu lebih rendah dari komponen terlemahnya.",6],
["[Calc] Two identical components, each with reliability 0.90, are in active parallel (one needed). System reliability is:","0.99","0.81","0.95","0.999","Rumus (paralel aktif, satu cukup):\n  Rp = 1 − (1 − R1) × (1 − R2)\n\nDiketahui:\n  R1 = R2 = 0,90\n\nLangkah:\n1) Ketidakandalan tiap unit: 1 − 0,90 = 0,10\n2) Keduanya gagal: 0,10 × 0,10 = 0,01\n3) Rp = 1 − 0,01 = 0,99\n\nJebakan: 0,90 × 0,90 = 0,81 adalah rumus seri.",6],
["[Calc] Three components in series each have a reliability of 0.99. System reliability is about:","0.970","0.990","0.980","0.999","Rumus (seri, komponen identik):\n  Rs = R^n\n\nDiketahui:\n  R = 0,99; n = 3\n\nLangkah:\n1) 0,99 × 0,99 = 0,9801\n2) 0,9801 × 0,99 = 0,9703\n\nJawaban: ≈ 0,970.",6],
["[Calc] A 2-out-of-3 system uses identical units, each with reliability 0.9. System reliability is:","0.972","0.999","0.990","0.810","Rumus (2-dari-3, unit identik):\n  R = 3R² − 2R³\n  (peluang tepat 2 bekerja + peluang ketiganya bekerja)\n\nDiketahui:\n  R = 0,9\n\nLangkah:\n1) R² = 0,81 → 3R² = 2,43\n2) R³ = 0,729 → 2R³ = 1,458\n3) 2,43 − 1,458 = 0,972\n\nCek: P(3 bekerja) = 0,729; P(tepat 2) = 3 × 0,81 × 0,1 = 0,243; total = 0,972.",6],
["Adding more components in series to a system generally:","Decreases system reliability","Increases system reliability","Increases MTBF if components are reliable","Has no effect if each component is above 0.99","Setiap komponen seri mengalikan reliabilitas (<1), sehingga menurunkan reliabilitas sistem.",6],
["Redundancy in which the backup unit is switched on only when the primary fails is called:","Standby redundancy","Active redundancy","Load-sharing redundancy","k-out-of-n redundancy","Standby redundancy: unit cadangan diaktifkan saat unit utama gagal.",6],
["A reliability block diagram (RBD) shows:","How components are logically connected in series and parallel","How components are physically arranged and piped in the plant","How a top event results from combinations of causes","How failure modes affect the next higher level","RBD = konfigurasi logis. Kombinasi penyebab = FTA; efek ke level atas = FMEA.",6],
["The three regions of the bathtub curve are:","Infant mortality, useful life, and wear-out","Burn-in, potential failure, and functional failure","Design, operation, and disposal","Random, age-related, and hidden failures","Kurva bathtub: early failure, laju konstan, wear-out.",6],
["A Weibull shape parameter β less than 1 indicates:","Infant mortality (decreasing failure rate)","Random failures (constant failure rate)","Wear-out (increasing failure rate)","Rapid wear-out after a failure-free period","β < 1 = laju kegagalan menurun.",6],
["A Weibull shape parameter β equal to 1 indicates:","A constant failure rate","A decreasing failure rate","An increasing failure rate","A normal distribution of failures","β = 1 identik dengan distribusi eksponensial; β ≈ 3,5 mendekati normal.",6],
["A Weibull shape parameter β greater than 1 indicates:","An increasing failure rate (wear-out)","A decreasing failure rate (infant mortality)","A constant failure rate (random failures)","A failure-free period before failures start","β > 1 = laju kegagalan meningkat; periode bebas gagal ditunjukkan parameter lokasi γ.",6],
["The Weibull characteristic life (η) is the time by which about what share of units have failed?","63.2%","50.0%","36.8%","10.0%","Pada t = η, F(t) = 1 − e^(−1) = 63,2%; 10% = B10 life.",6],
["According to the failure pattern studies discussed by Gulati, roughly what share of failures follow an age-related pattern?","Fewer than 20%","About 30–40%","About 50%","About 60–70%","Kurang dari 20% terkait usia; sekitar 80% atau lebih mengikuti pola acak.",6],
["The early airline failure studies cited by Gulati found that 68% of failures were due to:","Infant mortality","Random causes","Wear-out","Fatigue","Data menunjukkan 68% kegagalan akibat infant mortality.",6],
["Since most failures are not age-related, a key implication is that:","Fixed-interval overhauls are often ineffective","Overhaul intervals should be shortened","Run to failure is best for most assets","Spare parts holdings should be increased","Untuk kegagalan acak, overhaul berbasis waktu tidak efektif; tugas berbasis kondisi lebih tepat.",8],
["Infant mortality failures are commonly caused by:","Poor installation, workmanship, and manufacturing defects","Fatigue from cyclic loading accumulated over many years of operation","Gradual corrosion and erosion of components","Normal wear of sliding and rotating parts","Mitigasi dengan instalasi presisi, commissioning, dan burn-in.",6],
["Which is an example of a maintenance-induced failure?","Incorrect reassembly during a PM","Wear-out of a bearing at end of life","Random failure of an electronic card","Fatigue crack from vibration over time","PM dapat memasukkan cacat jika kualitas pekerjaan buruk.",3],
["On the P-F curve, P stands for:","Potential failure","Preventive maintenance","Predictive point","Performance loss","P = titik kegagalan potensial dapat dideteksi.",8],
["On the P-F curve, F stands for:","Functional failure","Fault detected","Failure finding","Final inspection","F = kegagalan fungsi; aset tidak lagi berfungsi sesuai standar.",8],
["The P-F interval is the time between:","When a potential failure can be detected and when it becomes a functional failure","When a defect is introduced and when it can first be detected","Two consecutive condition monitoring inspections on the same asset point","When a failure occurs and when the asset is restored to service","Interval P-F menentukan frekuensi inspeksi.",8],
["The inspection (CBM) frequency should be:","Shorter than the P-F interval, often about half","Equal to the P-F interval","Equal to the MTBF of the asset","Longer than the P-F interval to reduce the cost of monitoring","Interval inspeksi harus lebih pendek dari P-F agar ada waktu bertindak.",8],
["Can the P-F interval concept be applied to visual inspections?","Yes; faults can be detected visually as well as with technologies","No; it applies to vibration and oil analysis","Yes, but mainly for electrical equipment","Yes, when the asset follows a wear-out failure pattern","Inspeksi visual juga mendeteksi kegagalan potensial.",8],
["For a rolling element bearing, which typically gives the earliest warning of degradation?","Ultrasound or high-frequency vibration analysis","Overall vibration velocity trending","Infrared thermography of the housing","Audible noise detected by the operator","Ultrasound/vibrasi frekuensi tinggi mendeteksi paling dini; panas dan suara muncul belakangan.",8],
["RCM stands for:","Reliability-centered maintenance","Risk-centered maintenance","Reliability and condition monitoring","Root cause maintenance","RCM dikembangkan dari studi industri penerbangan.",8],
["The primary objective of RCM is to:","Preserve system function","Prevent failures from occurring","Reduce the number of PM tasks","Extend the life of components","RCM bertujuan menjaga fungsi dan mengoptimalkan kebutuhan perawatan, bukan mencegah semua kegagalan.",8],
["The SAE standard that sets criteria for an RCM process is:","SAE JA1011","SAE JA1012","ISO 14224","IEC 60300","SAE JA1011 = kriteria evaluasi proses RCM; JA1012 = panduan penerapannya.",8],
["The first of the seven RCM questions asks about:","Functions and performance standards in the present operating context","The ways in which the asset can fail to fulfill each of its functions","Causes of each functional failure","Consequences of each failure","RCM dimulai dari fungsi dan standar kinerja.",8],
["A functional failure is:","The inability of an asset to meet a required performance standard","A specific event that causes an asset to stop working completely","A defect that can be detected before the asset fails","The physical damage found during inspection","Failure mode = penyebab spesifik; potential failure = kondisi terdeteksi sebelum gagal.",8],
["A failure mode is:","The specific event that causes a functional failure","The loss of a function to the required standard","The consequence of a failure on operations","The point at which a failure becomes detectable","Contoh failure mode: bearing macet karena kurang pelumasan.",8],
["A hidden failure is one that:","Is not evident to operators under normal circumstances","Occurs suddenly without warning signs that operators can notice","Is detected mainly by vibration analysis","Does not affect safety or the environment","Contoh: relief valve atau pompa standby yang gagal tanpa terlihat.",8],
["The appropriate task for a hidden failure of a protective device is usually:","A failure-finding task","A condition-based task","A scheduled restoration task","A run-to-failure decision","Failure-finding task memeriksa apakah fungsi tersembunyi masih bekerja.",8],
["The RCM consequence categories are:","Hidden, safety/environmental, operational, and non-operational","Safety, environmental, production cost, and product quality impacts","Critical, major, minor, and negligible","Hidden, evident, operational, and economic","Konsekuensi menentukan strategi tugas di RCM.",8],
["If no effective task can be found for a failure mode with safety consequences, RCM requires:","Redesign","Run to failure","Failure-finding","More frequent inspection","Untuk konsekuensi keselamatan, redesign wajib bila tidak ada tugas yang efektif.",8],
["Run to failure (RTF) is an appropriate strategy when:","The cost and impact of failure are lower than preventive costs","The failure is hidden from the operators","The asset has a random failure pattern","The asset has a random failure pattern and no condition can be monitored","RTF adalah keputusan sadar berbasis ekonomi.",3],
["How does run to failure (RTF) differ from reactive maintenance?","RTF is a deliberate, documented strategy","RTF requires a spare to be held in stock","RTF requires a failure-finding task","RTF is decided during design","RTF dipilih dengan sengaja; reaktif terjadi karena tidak ada program terstruktur.",3],
["RCM provides the best results when applied during:","Design and development","Commissioning and startup","Operation, after failure history exists","Major overhauls","RCM paling bermanfaat bila diterapkan saat desain.",8],
["Can RCM be applied to new systems being designed?","Yes, and it is a good application","No, it requires failure history","Yes, after commissioning tests","Yes, but for safety-critical systems","RCM dapat dipakai untuk sistem baru maupun yang sedang beroperasi.",8],
["The biggest benefit of FMEA occurs during:","The design phase","The operation phase","The maintenance phase","Failure investigation","FMEA saat desain dapat menghilangkan failure mode dengan biaya rendah.",6],
["[Calc] In an FMEA, severity 8, occurrence 5, and detection 3 give an RPN of:","120","16","40","24","Rumus:\n  RPN = Severity × Occurrence × Detection\n\nDiketahui:\n  S = 8, O = 5, D = 3\n\nLangkah:\n1) 8 × 5 = 40\n2) 40 × 3 = 120\n\nJawaban: 120. Jebakan: 8 + 5 + 3 = 16 (dijumlah, bukan dikalikan).",11],
["In an FMEA, a high detection rating means:","The failure is hard to detect","The failure is easy to detect","The failure occurs frequently","The failure has severe effects","Skor detection tinggi = sulit dideteksi.",11],
["Fault tree analysis (FTA) is:","A top-down method that traces an undesired event to its causes","A bottom-up method that traces component failures to their effects","A method of ranking failure modes by risk priority","A method of estimating failure rates from field data","FTA deduktif (top-down); FMEA induktif (bottom-up).",11],
["In a fault tree, an AND gate means the output event occurs only if:","All input events occur","Any one of the input events occurs","At least two input events occur","The inputs occur in a set order","AND = semua input; OR = salah satu input.",11],
["The 10% rule of PM states that a time-based PM must be completed:","Within 10% of its frequency","Within 10 days of its due date","Before 10% of the PM interval has passed","No more than 10% early","PM 30 hari harus dilakukan dalam ±3 hari.",8],
["[Calc] A quarterly (90-day) PM under the 10% rule must be completed within:","±9 days of the due date","±3 days","±10 days","±7 days","Rumus (aturan 10% PM):\n  Jendela kepatuhan = ± 10% × Interval PM\n\nDiketahui:\n  Interval = 90 hari (kuartalan)\n\nLangkah:\n1) 10% × 90 = 9 hari\n2) Jendela: hari ke-81 s.d. hari ke-99\n\nJawaban: ±9 hari dari tanggal jatuh tempo.",8],
["Gulati suggests calendar-based PMs should be about what share of all PMs?","30% or less","About 50%","About 70%","At least 90%","Sebaiknya lebih banyak PM berbasis kondisi dan run/cycle.",8],
["PM and PdM tasks for critical assets should ideally be developed using:","FMEA/RCM methodology","OEM recommendations","Historical work order data","Industry standard checklists","Tugas berbasis FMEA/RCM tepat sasaran dan efektif biaya.",8],
["Condition-based maintenance (CBM) is maintenance:","Performed based on the measured condition of an asset","Performed at fixed intervals of operating hours or production cycles","Performed after an asset has failed","Performed by operators during their rounds","CBM memantau kondisi lalu bertindak bila diperlukan.",8],
["High vibration at 1× running speed in the radial direction most often indicates:","Unbalance","Misalignment","Looseness","Bearing defect","Unbalance menghasilkan puncak dominan pada 1× rpm radial.",8],
["High axial vibration with a strong 2× running speed component typically indicates:","Misalignment","Unbalance","Looseness","Resonance","Misalignment sering menunjukkan 1× dan 2× axial yang tinggi.",8],
["Mechanical looseness typically appears in a vibration spectrum as:","Many harmonics of running speed","A single dominant 1× peak","Sidebands around gear mesh frequency","Non-synchronous peaks with harmonics","Looseness menghasilkan banyak harmonik; non-synchronous = cacat bearing.",8],

["[Calc] Three components in series have constant failure rates of 0.001, 0.002, and 0.0005 per hour. The system MTBF is about:","286 hours","1,167 hours","3,500 hours","500 hours","Rumus (seri, laju kegagalan konstan):\n  λ sistem = λ1 + λ2 + λ3\n  MTBF sistem = 1 ÷ λ sistem\n\nDiketahui:\n  λ1 = 0,001; λ2 = 0,002; λ3 = 0,0005 per jam\n\nLangkah:\n1) λ sistem = 0,001 + 0,002 + 0,0005 = 0,0035 per jam\n2) MTBF = 1 ÷ 0,0035 = 285,7 jam\n\nJawaban: ≈ 286 jam.\nJebakan: menjumlah MTBF tiap komponen (1.000 + 500 + 2.000) ÷ 3 = 1.167 jam.",6],
