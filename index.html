["An equipment hierarchy in the CMMS allows:","Costs and history to roll up from components to systems","Work orders to be prioritized automatically by the system","Spare parts to be reordered automatically","Technicians to be assigned by craft","Hirarki aset (lihat ISO 14224) menstrukturkan data.",3],
["A standing (blanket) work order is best used for:","Small, repetitive tasks","Emergency repairs","Shutdown work packages","Capital projects","Standing WO menangkap jam untuk tugas kecil berulang.",4],
["Kitting means:","Staging all parts and materials for a job before it starts","Grouping similar jobs for the same area onto one work order","Assigning a crew to a job package","Storing spare parts by equipment area","Kit mengurangi perjalanan dan waktu tunggu.",4],
["Gulati notes that the percentage of kits delivered on time affects:","The planner's ability to plan jobs without expediting","The storeroom's inventory turnover ratio and stock levels","The accuracy of asset criticality rankings","The number of work requests received","Expediting menambah biaya yang tidak perlu.",4],
["The weekly schedule is typically built by the scheduler, while daily assignments of individuals are usually made by:","The supervisor","The planner","The scheduler","Operations","Supervisor menugaskan individu untuk pekerjaan harian.",4],
["Break-in work refers to:","Unscheduled work that interrupts the approved schedule","Work deferred from the previous week's schedule","Work done during equipment startup","Work added to the schedule at the weekly meeting","Break-in work menurunkan schedule compliance.",4],
["A weekly schedule coordination meeting mainly involves:","Maintenance and operations agreeing on equipment access","Maintenance and stores reviewing parts availability","Planners and supervisors reviewing estimates","Managers reviewing the maintenance budget","Koordinasi memastikan aset tersedia untuk dirawat.",4],
["A Gantt chart displays:","Tasks as bars along a timeline","Task dependencies as a network","Resource loading by craft","The sequence of the critical path","Gantt chart umum dipakai untuk jadwal.",4],
["The critical path in a shutdown schedule is:","The longest chain of dependent tasks","The tasks with the highest risk","The tasks requiring the most labor","The shortest chain of dependent tasks","Jalur terpanjang menentukan durasi minimum; tugas di dalamnya ber-float nol.",4],
["Float (slack) is:","How long a task can slip without delaying the project","The extra time added to each estimate as contingency","The time between two scheduled shutdowns","The duration of the critical path","Tugas dengan float dapat digeser tanpa menunda proyek.",4],
["A key success factor for turnarounds and shutdowns is:","Freezing the scope early","Starting planning after scope approval","Adding work up to the start date","Using in-house labor","Scope freeze mencegah scope growth.",4],
["Work that can be done before a shutdown starts, such as prefabrication and staging, is called:","Pre-shutdown work","Emergent work","Ready backlog","Deferred work","Pekerjaan pra-shutdown memperpendek durasi.",4],
["Work discovered during a shutdown after equipment is opened is called:","Emergent work","Break-in work","Scope creep","Deferred work","Perlu kontingensi untuk emergent (discovery) work.",4],
["A post-turnaround review is conducted mainly to:","Capture lessons learned for future turnarounds","Close out turnaround work orders and contractor invoices","Verify contractor invoices","Restart the equipment safely","Lessons learned meningkatkan turnaround berikutnya.",4],
["Before working on equipment, the correct LOTO sequence ends with:","Verifying zero energy before work begins","Applying the locks and tags to isolation points","Releasing stored energy from the system","Notifying affected employees of the shutdown","Verifikasi (try) memastikan energi nol sebelum bekerja.",13],
["A job safety analysis (JSA) is used to:","Identify the hazards of each job step and define controls","Rank jobs by their safety priority before they are scheduled","Investigate the causes of safety incidents","Verify that permits are in place","JSA dilakukan sebelum pekerjaan berisiko.",13],
["A well-written PM task instruction should:","Specify what to check and measurable acceptance criteria","Describe the purpose of the PM in general terms","List the tasks and leave limits to the technician","Follow the OEM manual word for word","Contoh: ukur suhu bearing, batas < 80°C.",3],
["If PM is being performed on an asset that keeps failing, the organization should:","Review and adjust the PM plan","Increase the PM frequency","Replace the asset","Switch to run to failure","PM yang tidak mencegah kegagalan perlu dievaluasi, bukan sekadar diperbanyak.",8],
["Which list matches Gulati's classification of maintenance practices?","CBM, PM, time-based, run-based, RCM-based, OBM/TPM, and CM","PM, PdM, CM, and emergency maintenance","Planned, unplanned, and shutdown maintenance","Preventive, predictive, proactive, and reactive maintenance","Klasifikasi Gulati dari CBM hingga CM reaktif.",3],
["Preventive maintenance is intended to:","Find potential failures and correct them before they fail","Restore equipment after a functional failure","Identify hidden failures in protective devices","Replace wearing components at fixed calendar intervals","PM = inspeksi dan servis pada interval tertentu untuk menemukan masalah sebelum gagal.",3],
["Run-based maintenance schedules tasks based on:","Operating hours, cycles, or throughput","Fixed calendar intervals set by OEM","Measured condition","Failure history","Run-based mengikuti pemakaian aktual.",3],
["The main objective of an MRO storeroom is to:","Have the right parts available when needed at lowest total cost","Keep inventory value as low as possible to reduce carrying cost","Maximize the inventory turnover ratio","Stock each part listed in the equipment BOMs","Keseimbangan antara ketersediaan dan biaya.",5],
["Gulati's recommended inventory turnover ratio for an MRO storeroom is:","Less than 2","Between 2 and 4","Between 4 and 6","Over 6","MRO turns < 2 karena suku cadang kritikal mahal dan jarang dipakai.",5],
["Inventory turnover ratio is calculated as:","Value of inventory issued ÷ average inventory value","Average inventory value ÷ value of inventory issued","Number of items issued ÷ number of items stocked","Value of inventory purchased ÷ ending inventory value","Turns = nilai issue / rata-rata nilai inventori.",5],
["[Calc] Annual issues are $2 million and average MRO inventory is $4 million. The turnover ratio is:","0.5","2.0","0.25","1.5","Rumus:\n  Inventory turnover = Nilai barang keluar (issued) per tahun ÷ Rata-rata nilai inventori\n\nDiketahui:\n  Issue = $2 juta, rata-rata inventori = $4 juta\n\nLangkah:\n1) 2 ÷ 4 = 0,5\n\nJawaban: 0,5 kali per tahun (rendah, tetapi Gulati menyebut MRO < 2 adalah wajar).\nJebakan: 4 ÷ 2 = 2,0 membalik rumus.",5],
["In ABC analysis, A items typically represent:","About 20% of items and 70–80% of value","About 50% of items and 50% of value","About 80% of items and 20% of value","About 10% of items and 90% of value","ABC = usage value analysis.",5],
["Service level (SL) relates to the stockout rate (SO) as:","SL = 1 − SO","SL = 1 ÷ SO","SL = SO × 100","SL = 1 + SO","Stockout 4% berarti service level 96%.",5],
["Gulati defines percentage of stockouts as:","Number of stockouts ÷ total items issued","Number of stockouts ÷ total items stocked","Value of stockouts ÷ inventory value","Number of stockouts ÷ work orders","Stockout tinggi menyebabkan delay pekerjaan.",5],
["Inventory shrinkage includes losses from:","Deterioration, obsolescence, and theft","Issues to work orders","Returns to suppliers","Normal issues of parts to work orders","Shrinkage menurunkan nilai inventori.",5],
["Inventory variance (cycle count accuracy) measures:","Differences between physical counts and records","Differences between budgeted and actual spend","Differences between ordered and received quantities","Differences between issues and receipts","Akurasi catatan inventori sangat penting.",5],
["Economic order quantity (EOQ) is calculated as:","√(2DS ÷ H)","√(2DH ÷ S)","2DS ÷ H","√(DS ÷ 2H)","D = pemakaian tahunan, S = biaya pesan, H = biaya simpan per unit per tahun.",5],
["[Calc] Annual demand is 1,000 units, order cost is $50, and carrying cost is $10 per unit per year. EOQ is:","100 units","50 units","200 units","70 units","Rumus:\n  EOQ = √(2 × D × S ÷ H)\n  D = permintaan tahunan, S = biaya per pesanan, H = biaya simpan per unit per tahun\n\nDiketahui:\n  D = 1.000, S = $50, H = $10\n\nLangkah:\n1) 2 × 1.000 × 50 = 100.000\n2) 100.000 ÷ 10 = 10.000\n3) √10.000 = 100\n\nJawaban: 100 unit per pesanan.",5],
["Does EOQ improve the inventory turnover ratio, according to Gulati?","No; it optimizes ordering and carrying cost","Yes; smaller orders raise turns","Yes, but mainly for A items","Yes, when demand is constant","Gulati: EOQ tidak berdampak pada turnover ratio.",5],
["If the carrying cost of an item increases, the EOQ will:","Decrease","Increase","Stay the same","Double","H di penyebut; H naik maka EOQ turun.",5],
["Carrying (holding) cost includes:","Storage, capital, insurance, and obsolescence","Ordering, receiving, inspection, and freight","Ordering, receiving, and inspection","Stockout and expediting costs","Biaya simpan sekitar 20–25% nilai per tahun; biaya pesan termasuk ordering/receiving.",5],
["In a min/max inventory system, a reorder is triggered when:","Stock falls to the minimum","Stock reaches the maximum","A fixed review date arrives","A stockout occurs","Min/max memesan sampai level maksimum saat stok mencapai minimum.",5],
["Safety stock is held to protect against:","Variability in demand and lead time","Price increases from suppliers","Obsolescence of slow-moving items","Errors in cycle counting","Safety stock mencegah stockout.",5],
["Critical (insurance) spares are:","Costly, long-lead parts held for critical assets","Fast-moving parts with high usage","Parts held under consignment by vendors","Parts repaired and returned to stock","Insurance spares menurunkan turns tetapi melindungi produksi.",5],
["Rotable (repairable) spares are:","Components repaired and returned to stock","Spares rotated in storage to prevent damage","Spares shared between several sites","Spares stocked by the vendor on site","Rotables dikelola dengan siklus perbaikan.",5],
["Vendor-managed inventory (VMI) means:","The supplier monitors and replenishes the customer's stock","The customer stores the supplier's stock until it is used","The supplier delivers parts directly to the job site","The customer orders from a catalog managed by the vendor","VMI mengalihkan pengelolaan stok ke pemasok.",5],

["Automated storage and retrieval systems (AS/RS) are used to:","Store and retrieve items with less space and labor","Track inventory transactions automatically in the CMMS","Reorder parts automatically from suppliers","Identify obsolete parts in the storeroom","AS/RS bagian dari tata letak storeroom modern.",5],
["Gulati calls which measure the primary measure of maintenance workforce efficiency?","Wrench time","Schedule compliance","Percentage of planned work","Overtime percentage","Wrench time menunjukkan produktivitas teknisi.",4],
["The required number of technicians can be estimated as:","Workload hours ÷ productive hours per technician","Workload hours ÷ total paid hours per technician","Number of assets ÷ assets per technician","Maintenance budget ÷ average wage","Analisis beban kerja menentukan staf; gunakan jam produktif, bukan jam dibayar.",4],
["Integrating maintenance schedules with production plans mainly helps to:","Make equipment available when maintenance resources are ready","Reduce the number of PMs required on production equipment","Eliminate the need for a weekly schedule","Reduce the size of the ready backlog","Ketersediaan aset untuk dirawat sesuai jadwal yang disepakati.",4],
["The percentage of assets delivered on time to maintenance per the agreed schedule measures:","Operations' support of the maintenance schedule","Maintenance's own schedule compliance for the week","Storeroom's kit delivery performance","The planner's estimate accuracy","Operasi harus menyerahkan aset sesuai jadwal.",7],
["Work requests should be screened and approved by:","A designated coordinator, supervisor, or planner","The technician who has been assigned to do the work","The storeroom attendant","The person who requested the work","Screening mencegah duplikasi dan pekerjaan tidak perlu.",4],
["Labor estimates in job plans should be:","Reasonable for a qualified technician and refined with feedback","Exact before the job is scheduled, so that schedules are met","Based on the time of the most junior technician","Set by the supervisor at assignment","Estimasi dipakai untuk menjadwalkan beban kerja.",4],
["Work classification combined with job priority allows an organization to:","Manage the backlog and focus on the work with most impact","Eliminate the need for a formal asset criticality analysis","Reduce the number of work requests received","Schedule work without operations' input","Kombinasi klasifikasi dan prioritas mengelola backlog.",4],
["A maintenance backlog is:","Essential work not yet completed","Work completed but not yet closed","Work deferred until the next shutdown","Work that was cancelled","Backlog dikelola berdasarkan kategori dan prioritas.",4],
["[Calc] A monthly (30-day) PM is due on day 30. Under the 10% rule, it is compliant if completed between:","Day 27 and day 33","Day 25 and day 35","Day 28 and day 32","Day 30 and day 33","Rumus (aturan 10% PM):\n  Jendela = Jatuh tempo ± (10% × Interval)\n\nDiketahui:\n  Interval = 30 hari, jatuh tempo hari ke-30\n\nLangkah:\n1) 10% × 30 = 3 hari\n2) 30 − 3 = hari ke-27; 30 + 3 = hari ke-33\n\nJawaban: antara hari ke-27 dan ke-33.",8],
["Routine expediting of parts mainly indicates:","Weak planning and inventory processes","High service levels in the storeroom","Strong supplier partnerships","Good schedule compliance","Expediting adalah pemborosan yang perlu dihilangkan.",4],
["[Calc] Daily usage of a part is 4 units, supplier lead time is 10 days, and safety stock is 12 units. The reorder point is:","52 units","40 units","48 units","28 units","Rumus:\n  Reorder point (ROP) = (Pemakaian harian × Lead time) + Safety stock\n\nDiketahui:\n  Pemakaian = 4 unit/hari; lead time = 10 hari; safety stock = 12 unit\n\nLangkah:\n1) Pemakaian selama lead time = 4 × 10 = 40 unit\n2) ROP = 40 + 12 = 52 unit\n\nJebakan: 40 unit lupa safety stock.",5],
["[Calc] 188 of 200 PMs due this month were completed within the 10% window. PM compliance is:","94%","96%","88%","92%","Rumus:\n  PM compliance = PM selesai dalam jendela ÷ PM jatuh tempo × 100%\n\nDiketahui:\n  Selesai dalam jendela 10% = 188; jatuh tempo = 200\n\nLangkah:\n1) 188 ÷ 200 = 0,94\n2) 0,94 × 100% = 94%\n\nInterpretasi: di bawah benchmark Gulati ≥ 95%.",3],
["[Calc] Of 1,800 maintenance labor hours worked, 1,530 were on planned work. The percentage of planned work is:","85%","82%","88%","15%","Rumus:\n  % planned work = Jam pekerjaan terencana ÷ Total jam kerja × 100%\n\nDiketahui:\n  Terencana = 1.530 jam; total = 1.800 jam\n\nLangkah:\n1) 1.530 ÷ 1.800 = 0,85\n2) 0,85 × 100% = 85%\n\nJebakan: 15% adalah porsi pekerjaan tidak terencana.",4],
["[Calc] Average MRO inventory is $3 million and the annual carrying cost rate is 22%. The annual carrying cost is about:","$660,000","$136,000","$300,000","$750,000","Rumus:\n  Biaya simpan tahunan = Rata-rata nilai inventori × Tingkat biaya simpan\n\nDiketahui:\n  Rata-rata inventori = $3.000.000; tingkat = 22%\n\nLangkah:\n1) 3.000.000 × 0,22 = 660.000\n\nJawaban: $660.000 per tahun (Gulati: biaya simpan ±20–25% nilai).",5],
["[Calc] Ready backlog is 1,350 hours. A crew of 9 technicians works 40 hours a week, with 75% of hours available for backlog work. The ready backlog is:","5.0 weeks","3.8 weeks","4.2 weeks","6.7 weeks","Rumus:\n  Kapasitas mingguan = Teknisi × Jam/minggu × % jam untuk backlog\n  Backlog (minggu) = Jam ready backlog ÷ Kapasitas mingguan\n\nDiketahui:\n  1.350 jam; 9 teknisi; 40 jam/minggu; 75%\n\nLangkah:\n1) 9 × 40 = 360 jam\n2) 360 × 0,75 = 270 jam per minggu\n3) 1.350 ÷ 270 = 5,0 minggu\n\nJebakan: 1.350 ÷ 360 = 3,75 ≈ 3,8 minggu lupa faktor 75%.",4],
["The weekly schedule should normally be built from:","Ready backlog work that is planned and has parts available","All approved work requests, whether or not they are ready","Work requested by operations in the past week","Jobs ordered by the date they were requested","Hanya pekerjaan siap yang dijadwalkan agar tidak terjadi delay.",4],
["Before building the weekly schedule, the scheduler forecasts crew hours by:","Subtracting vacation, training, and other known absences","Counting the total paid hours of every technician in the crew","Adding expected overtime for emergencies","Using the hours worked in the previous week","Forecast jam tersedia menjadi dasar beban 100%.",4],
["A complete job package from the planner typically includes:","Work order, job plan, drawings, permits, and parts list","Work order, purchase requisitions, and the weekly schedule","Job plan and purchase requisitions","Drawings and the weekly schedule","Paket kerja lengkap mengurangi waktu tunggu teknisi.",4],
["A key step in controlling a shutdown work list is to:","Challenge and validate each requested item before scope freeze","Accept every request submitted by operations to avoid conflict","Add PM tasks that are not yet due","Delay planning until the work list is final","Validasi mencegah pekerjaan yang tidak perlu menambah durasi.",4],
["Parts bought for a specific job and charged directly to its work order are called:","Non-stock (direct-charge) items","Stocked (inventory) items","Consignment items","Rotable items","Item non-stok tidak masuk inventori gudang.",5],
["Inventory items with no usage for an extended period should be:","Reviewed for criticality before disposal or retention","Kept in stock indefinitely in case they are needed","Disposed of without review","Transferred to the shop floor","Item tidak bergerak bisa jadi insurance spare; perlu ditinjau.",5],
["Cycle counting means:","Counting a portion of inventory regularly, with A items counted more often","Counting every item once a year during the annual plant shutdown","Counting only items that have had a stockout","Counting items when they are received from suppliers","Cycle count menjaga akurasi tanpa menghentikan operasi gudang.",5],
["Work order status codes (such as 'waiting for parts') mainly help to:","Track work through the process and expose delays","Calculate the actual labor and material cost of each job","Prioritize work orders automatically","Assign technicians to each job","Status menunjukkan di mana pekerjaan tertahan.",3],
["Accurate MTBF calculation from CMMS history mainly requires:","Correct failure codes and dates on work orders","Labor costs recorded on each work order","Parts costs recorded on each work order","Supervisor approval of each work order","Tanpa kode dan tanggal kegagalan, data keandalan tidak valid.",3],
["A PM route is used to:","Group inspections by area or asset type for efficient execution","Determine the order in which failure modes are analyzed","Track the movement of parts through the storeroom","Show the critical path of a shutdown","Route mengurangi waktu perjalanan teknisi.",3],
["Corrective work found during a PM inspection should usually be:","Written as a separate work order and planned","Done immediately regardless of size","Added to the PM work order without notes","Reported verbally to the supervisor","Pekerjaan korektif besar direncanakan agar tidak mengganggu jadwal PM.",3],
["Effective contractor management in maintenance includes:","Clear scope, safety qualification, and supervision of work","Selecting the lowest bid and letting contractors self-supervise","Letting contractors plan their own work orders","Paying contractors only after the shutdown ends","Kontraktor harus dikelola seperti tenaga internal.",4],
["Storeroom access should be:","Controlled, with trained staff issuing parts","Open to technicians at all hours to save time","Limited to supervisors only","Managed by the planners","Akses terkontrol menjaga akurasi stok dan mencegah shrinkage.",5],
["A staging area in the storeroom is used to:","Hold kitted parts ready for scheduled jobs","Store obsolete parts awaiting disposal","Receive parts from suppliers for inspection","Store repairable spares awaiting repair","Kit disiapkan di area staging sebelum pekerjaan dimulai.",5],
["Emergency work is best defined as work that:","Must start immediately because of a safety, environmental, or major production risk","Is requested by operations for completion during the current shift","Was not included in the approved weekly schedule for the crew","Takes less than one hour to complete","Tidak semua pekerjaan di luar jadwal adalah darurat.",4]

<script>
(function(){
"use strict";
const PILLARS={
 1:{en:"Business & Management",id:"Bisnis & Manajemen"},
 2:{en:"Manufacturing Process Reliability",id:"Keandalan Proses Manufaktur"},
 3:{en:"Equipment Reliability",id:"Keandalan Peralatan"},
 4:{en:"Organization & Leadership",id:"Organisasi & Kepemimpinan"},
 5:{en:"Work Management",id:"Manajemen Pekerjaan"}
};
const CHAPTERS={1:"Introducing Best Practices",2:"Culture and Leadership",3:"Understanding Maintenance",4:"Work Management: Planning and Scheduling",5:"Materials, Parts, and Inventory Management",6:"Measuring and Designing for Reliability and Maintainability",7:"Operator-Driven Reliability",8:"Maintenance Optimization",9:"Managing Performance",10:"Workforce Management",11:"Problem Solving and Improvement Tools",12:"Standards, Standardization, and Certification",13:"Current Trends and Practices"};
const TARGET=70;
const BANK={};
for(const p of [1,2,3,4,5]){(QB[p]||[]).forEach((r,i)=>{const id=p+"-"+(i+1);const calc=r[0].startsWith("[Calc] ");BANK[id]={id,p,q:calc?r[0].slice(7):r[0],calc,opts:[r[1],r[2],r[3],r[4]],e:r[5],ch:r[6]}})}
const ids=p=>Object.keys(BANK).filter(k=>BANK[k].p===p);

/* storage (per-viewer convenience) */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const K_SES="cmrp_session_v1",K_HIST="cmrp_history_v1",K_STAT="cmrp_qstats_v1",K_CFG="cmrp_cfg_v1";

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0")};
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const L="ABCD";

let S=null; // active session
let view="home", reviewFilter="wrong", showNav=false, timerId=null, modal=null;

function pickQuestions(p,n,prioritize){
  let pool=shuffle(p==="calc"?Object.keys(BANK).filter(k=>BANK[k].calc):ids(p));
  if(prioritize){const st=store.get(K_STAT,{});const score=id=>{const s=st[id];if(!s)return 0;return s[1]===s[0]?2:1};pool.sort((a,b)=>score(a)-score(b))}
  return pool.slice(0,n);
}
function newSession(cfg){
  let list=[];
  if(cfg.ids)list=shuffle(cfg.ids);
  else if(cfg.mode==="exam"){for(const p of [1,2,3,4,5])list=list.concat(pickQuestions(p,cfg.dist[p],false));list=shuffle(list)}
  else{if(cfg.pillar==="calc")list=pickQuestions("calc",cfg.count,cfg.prio);else if(cfg.pillar==="all"){const per=Math.ceil(cfg.count/5);for(const p of [1,2,3,4,5])list=list.concat(pickQuestions(p,per,cfg.prio));list=shuffle(list).slice(0,cfg.count)}else list=pickQuestions(+cfg.pillar,cfg.count,cfg.prio)}
  S={mode:cfg.mode,src:cfg,label:cfg.ids?"Latihan topik \u201C"+cfg.query+"\u201D":cfg.mode==="exam"?"Simulasi Ujian":(cfg.pillar==="all"?"Latihan Campuran":cfg.pillar==="calc"?"Latihan Soal Hitungan":"Latihan Pilar "+cfg.pillar),
    items:list.map(id=>({id,order:shuffle([0,1,2,3])})),ans:{},flag:{},cur:0,start:Date.now(),
    durMs:cfg.mode==="exam"?cfg.minutes*60000:0,endAt:cfg.mode==="exam"?Date.now()+cfg.minutes*60000:0,done:false};
  save();view="quiz";showNav=false;render();
}
function save(){if(S&&!S.done)store.set(K_SES,S)}

function finish(auto){
  if(!S||S.done)return;
  S.done=true;S.finish=Date.now();S.auto=!!auto;
  const st=store.get(K_STAT,{});let ok=0;const per={};
  S.items.forEach((it,i)=>{const q=BANK[it.id];per[q.p]=per[q.p]||[0,0];per[q.p][1]++;const right=S.ans[i]===0;if(right){ok++;per[q.p][0]++}
    if(S.ans[i]!==undefined){const s=st[it.id]||[0,0];s[0]++;if(right)s[1]++;st[it.id]=s}});
  store.set(K_STAT,st);
  const h=store.get(K_HIST,[]);h.unshift({t:S.finish,label:S.label,mode:S.mode,ok,n:S.items.length,per,used:S.finish-S.start});store.set(K_HIST,h.slice(0,30));
  store.del(K_SES);stopTimer();view="result";reviewFilter="wrong";render();window.scrollTo(0,0);
}

/* timer */
function startTimer(){stopTimer();if(S&&S.mode==="exam"&&!S.done)timerId=setInterval(tick,500)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function tick(){const el=$("#timer");if(!S||S.done||S.mode!=="exam"||view!=="quiz")return;const left=S.endAt-Date.now();if(left<=0){finish(true);return}
  if(el){el.textContent=fmt(left);el.className="timer"+(left<5*60000?" crit":left<15*60000?" warn":"")}}

/* ---------- views ---------- */
function render(){
  if(view==="home")renderHome();else if(view==="quiz")renderQuiz();else renderResult();
  renderModal();
}
function pillarMastery(){const st=store.get(K_STAT,{});const r={};for(const p of [1,2,3,4,5]){let seen=0,mast=0;ids(p).forEach(id=>{const s=st[id];if(s){seen++;if(s[1]>0&&s[1]===s[0])mast++}});r[p]={seen,mast,n:ids(p).length}}return r}

function renderHome(){
  stopTimer();
  const cfg=store.get(K_CFG,{minutes:150,dist:{1:22,2:22,3:22,4:22,5:22},pillar:"1",count:20,prio:true});
  const ses=store.get(K_SES,null);const hist=store.get(K_HIST,[]);const m=pillarMastery();
  const total=Object.keys(BANK).length;
  $("#app").innerHTML=`
  <header class="hero">
    <span class="eyebrow">Certified Maintenance &amp; Reliability Professional</span>
    <h1>Simulator Ujian CMRP</h1>
    <p class="muted">Latihan soal pilihan ganda berdasarkan lima pilar SMRP Body of Knowledge, mengacu pada <i>Maintenance and Reliability Best Practices</i> (Ramesh Gulati). Soal dalam bahasa Inggris seperti ujian aslinya; pembahasan dalam bahasa Indonesia.</p>
  </header>
  <div class="spec" aria-label="Format ujian">
    <div><b>110</b><span>Soal ujian</span></div>
    <div><b>150</b><span>Menit</span></div>
    <div><b>4</b><span>Pilihan / soal</span></div>
    <div><b>${total}</b><span>Bank soal</span></div>
  </div>
  ${ses?`<div class="resume" style="margin-top:16px"><div><b>${esc(ses.label)} belum selesai</b><p class="muted" style="font-size:14px">${Object.keys(ses.ans).length} dari ${ses.items.length} soal terjawab${ses.mode==="exam"?" · sisa waktu "+fmt(ses.endAt-Date.now()):""}</p></div>
    <div class="row"><button class="btn ghost" id="discard">Buang</button><button class="btn primary" id="resume">Lanjutkan</button></div></div>`:""}
  <section style="margin-top:28px" aria-labelledby="sh">
    <h2 id="sh">Cari topik</h2>
    <div class="search"><input id="q" type="search" placeholder="Ketik kata kunci, mis. NPV, Weibull, EOQ, Kotter" value="${esc(cfg.query||"")}" autocomplete="off" aria-describedby="qhint"><button class="btn primary" id="qgo" disabled>Latihan</button></div>
    <div class="chips" role="group" aria-label="Topik cepat">${["NPV","OEE","MTBF","Weibull","P-F","RCM","FMEA","EOQ","backlog","Cpk","5S","Kotter"].map(t=>`<button class="chip" data-q="${t}">${t}</button>`).join("")}</div>
    <p id="qhint" class="muted" style="font-size:13px">Mencari di teks soal, pilihan jawaban, dan pembahasan. Beberapa kata = semua harus cocok.</p>
    <div id="qres"></div>
  </section>
  <section style="margin-top:28px">
    <h2>Mulai</h2>
    <div class="modes">
      <div class="mode main">
        <span class="eyebrow">Mode ujian</span>
        <h3>Simulasi Ujian Lengkap</h3>
        <p class="muted" style="font-size:14px">Soal diacak dari kelima pilar dengan timer berjalan. Jawaban dan pembahasan tampil setelah ujian diserahkan. Waktu habis = otomatis diserahkan.</p>
        <div class="field"><label>Distribusi soal per pilar (total <span id="dtot" class="mono"></span>)</label>
          <div class="dist">${[1,2,3,4,5].map(p=>`<div class="field"><label for="d${p}">P${p}</label><input id="d${p}" type="number" min="0" max="100" value="${cfg.dist[p]}"></div>`).join("")}</div></div>
        <div class="field"><label for="mins">Durasi (menit)</label><input id="mins" type="number" min="10" max="300" value="${cfg.minutes}"></div>
        <button class="btn primary" id="startExam">Mulai simulasi</button>
      </div>
      <div class="mode">
        <span class="eyebrow">Mode latihan</span>
        <h3>Latihan per Pilar</h3>
        <p class="muted" style="font-size:14px">Tanpa batas waktu. Kunci jawaban dan pembahasan langsung muncul setiap kali Anda memilih jawaban.</p>
        <div class="field"><label for="pp">Pilar</label><select id="pp">
          ${[1,2,3,4,5].map(p=>`<option value="${p}" ${cfg.pillar==p?"selected":""}>Pilar ${p} · ${PILLARS[p].id}</option>`).join("")}
          <option value="all" ${cfg.pillar==="all"?"selected":""}>Campuran semua pilar</option>
          <option value="calc" ${cfg.pillar==="calc"?"selected":""}>Soal hitungan saja (${Object.values(BANK).filter(q=>q.calc).length} soal)</option></select></div>
        <div class="field"><label for="pc">Jumlah soal</label><select id="pc">${[10,20,30,50,100].map(n=>`<option ${cfg.count==n?"selected":""}>${n}</option>`).join("")}</select></div>
        <label class="check"><input type="checkbox" id="prio" ${cfg.prio?"checked":""}><span>Utamakan soal yang belum pernah dijawab atau pernah salah</span></label>
        <button class="btn" id="startPrac">Mulai latihan</button>
      </div>
    </div>
  </section>
  <section style="margin-top:28px">
    <h2>Bank soal per pilar</h2>
    <p class="muted" style="font-size:14px">Bilah menunjukkan soal yang sudah Anda kuasai (selalu dijawab benar) di perangkat ini.</p>
    <div class="pillars">${[1,2,3,4,5].map(p=>`<div class="pill" style="--pc:var(--p${p})"><span class="n">PILAR ${p} · ${m[p].n} SOAL</span><h3>${PILLARS[p].id}</h3><span class="muted" style="font-size:12.5px">${PILLARS[p].en}</span>
      <div class="meter" role="img" aria-label="${m[p].mast} dari ${m[p].n} dikuasai"><i style="width:${pct(m[p].mast,m[p].n)}%"></i></div>
      <span class="mono muted" style="font-size:12px">${m[p].mast} dikuasai · ${m[p].seen} pernah dijawab</span></div>`).join("")}</div>
  </section>
  <section style="margin-top:28px">
    <h2>Riwayat</h2>
    ${hist.length?`<div class="hist"><table><thead><tr><th>Waktu</th><th>Sesi</th><th>Skor</th><th>Durasi</th><th></th></tr></thead><tbody>
      ${hist.slice(0,12).map(h=>{const sc=pct(h.ok,h.n);return `<tr><td class="mono">${new Date(h.t).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(h.label)}</td><td class="mono">${h.ok}/${h.n} · ${sc}%</td><td class="mono">${fmt(h.used)}</td><td><span class="tag ${sc>=TARGET?"ok":"bad"}">${sc>=TARGET?"Di atas target":"Di bawah target"}</span></td></tr>`}).join("")}
    </tbody></table></div>`:`<p class="muted">Belum ada sesi. Hasil setiap simulasi dan latihan akan tersimpan di sini (hanya di browser ini).</p>`}
  </section>
  <footer>Target latihan ${TARGET}% adalah patokan pribadi, bukan nilai kelulusan resmi; SMRP memakai skor berskala. Soal disusun orisinal dari konsep dan angka benchmark dalam buku, bukan salinan soal resmi. Referensi bab ditampilkan di setiap pembahasan.</footer>`;
  const upd=()=>{let t=0;[1,2,3,4,5].forEach(p=>t+=+$("#d"+p).value||0);$("#dtot").textContent=t};upd();
  [1,2,3,4,5].forEach(p=>$("#d"+p).addEventListener("input",upd));
  const readCfg=()=>{const c={minutes:Math.min(300,Math.max(10,+$("#mins").value||150)),dist:{},pillar:$("#pp").value,count:+$("#pc").value,prio:$("#prio").checked};[1,2,3,4,5].forEach(p=>c.dist[p]=Math.min(100,Math.max(0,Math.round(+$("#d"+p).value||0))));store.set(K_CFG,c);return c};
  $("#startExam").onclick=()=>{const c=readCfg();const t=Object.values(c.dist).reduce((a,b)=>a+b,0);if(!t){$("#dtot").textContent="0 — isi minimal satu pilar";return}
    if(ses){modal={title:"Mulai ujian baru?",body:"Sesi yang belum selesai akan dibuang.",ok:"Mulai baru",fn:()=>{store.del(K_SES);newSession({mode:"exam",...c})}};renderModal();return}
    newSession({mode:"exam",...c})};
  const norm=t=>t.toLowerCase();
  const search=qs=>{const terms=norm(qs).split(/\s+/).filter(Boolean);if(!terms.length)return [];return Object.keys(BANK).filter(id=>{const q=BANK[id];const hay=norm(q.q+" "+q.opts.join(" ")+" "+q.e);return terms.every(t=>hay.includes(t))})};
  const hl=(txt,qs)=>{let h=esc(txt);norm(qs).split(/\s+/).filter(Boolean).forEach(t=>{const re=new RegExp("("+esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");h=h.replace(re,"<mark>$1</mark>")});return h};
  let hits=[],showAll=false;
  const runSearch=()=>{const qs=$("#q").value.trim();hits=search(qs);const c=store.get(K_CFG,{});c.query=qs;store.set(K_CFG,c);
    $("#qgo").disabled=!hits.length;$("#qgo").textContent=hits.length?"Latihan "+hits.length+" soal":"Latihan";
    if(!qs){$("#qres").innerHTML="";return}
    if(!hits.length){$("#qres").innerHTML=`<p class="muted">Tidak ada soal yang cocok dengan \u201C${esc(qs)}\u201D. Coba kata lain atau ejaan bahasa Inggris (mis. "backlog", "inventory").</p>`;return}
    const per={};hits.forEach(id=>{const p=BANK[id].p;per[p]=(per[p]||0)+1});const nc=hits.filter(id=>BANK[id].calc).length;
    const shown=showAll?hits:hits.slice(0,8);
    $("#qres").innerHTML=`<div class="qsum"><b>${hits.length} soal cocok</b>${[1,2,3,4,5].filter(p=>per[p]).map(p=>`<span class="tag" style="--pc:var(--p${p})"><span class="dot"></span>P${p} · ${per[p]}</span>`).join("")}${nc?`<span class="tag calc">Hitungan · ${nc}</span>`:""}</div>
      <ol class="qlist">${shown.map(id=>{const q=BANK[id];return `<li style="--pc:var(--p${q.p})"><span class="dot"></span><span>${hl(q.q,qs)}</span></li>`}).join("")}</ol>
      ${hits.length>8?`<button class="btn ghost" id="qmore">${showAll?"Tampilkan lebih sedikit":"Tampilkan semua "+hits.length+" soal"}</button>`:""}`;
    if($("#qmore"))$("#qmore").onclick=()=>{showAll=!showAll;runSearch()}};
  $("#q").addEventListener("input",()=>{showAll=false;runSearch()});
  $("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&hits.length)$("#qgo").click()});
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("#q").value=b.dataset.q;showAll=false;runSearch();$("#q").focus()});
  runSearch();
  $("#qgo").onclick=()=>{if(!hits.length)return;const qs=$("#q").value.trim();const go=()=>{store.del(K_SES);newSession({mode:"practice",ids:hits.slice(),query:qs})};
    if(ses){modal={title:"Mulai latihan topik?",body:"Sesi yang belum selesai akan dibuang.",ok:"Mulai baru",fn:go};renderModal();return}go()};
  $("#startPrac").onclick=()=>{const c=readCfg();const go=()=>{store.del(K_SES);newSession({mode:"practice",pillar:c.pillar,count:c.count,prio:c.prio})};
    if(ses){modal={title:"Mulai latihan baru?",body:"Sesi yang belum selesai akan dibuang.",ok:"Mulai baru",fn:go};renderModal();return}go()};
  if(ses){$("#resume").onclick=()=>{S=ses;if(S.mode==="exam"&&S.endAt<=Date.now()){finish(true);return}view="quiz";render()};
    $("#discard").onclick=()=>{store.del(K_SES);render()}}
}

function renderQuiz(){
  const it=S.items[S.cur],q=BANK[it.id],n=S.items.length,answered=Object.keys(S.ans).length,chosen=S.ans[S.cur];
  const prac=S.mode==="practice",locked=prac&&chosen!==undefined;
  const flagged=!!S.flag[S.cur];
  $("#app").innerHTML=`
  <div class="bar"><div class="bar-in">
    <div class="stack" style="gap:2px"><span class="eyebrow">${esc(S.label)}</span><b class="mono" style="font-size:15px">Soal ${S.cur+1} / ${n}</b></div>
    <div class="progress"><div class="meter"><i style="width:${pct(answered,n)}%"></i></div><span class="muted mono" style="font-size:12px">${answered} terjawab · ${Object.values(S.flag).filter(Boolean).length} ditandai</span></div>
    ${S.mode==="exam"?`<div id="timer" class="timer" role="timer" aria-label="Sisa waktu">${fmt(S.endAt-Date.now())}</div>`:""}
    <div class="row"><button class="btn ghost" id="toggleNav" aria-expanded="${showNav}">Daftar soal</button><button class="btn" id="submit">${prac?"Akhiri":"Serahkan"}</button></div>
  </div></div>
  <article class="qcard" style="--pc:var(--p${q.p})">
    <div class="qmeta"><span class="tag"><span class="dot"></span>Pilar ${q.p} · ${PILLARS[q.p].id}</span>${q.calc?`<span class="tag calc">Hitungan</span>`:""}${flagged?`<span class="tag flag">Ditandai</span>`:""}</div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts" role="radiogroup" aria-label="Pilihan jawaban">
      ${it.order.map((oi,pos)=>{let cls="opt";if(locked){if(oi===0)cls+=" right";else if(oi===chosen)cls+=" wrong"}else if(chosen===oi)cls+=" sel";
        return `<button class="${cls}" role="radio" aria-checked="${chosen===oi}" data-oi="${oi}" ${locked?"disabled":""}><span class="k">${L[pos]}</span><span class="t">${esc(q.opts[oi])}</span></button>`}).join("")}
    </div>
    ${locked?`<div class="explain ${chosen===0?"good":"bad"}"><b>${chosen===0?"Benar.":"Kurang tepat. Jawaban: "+L[it.order.indexOf(0)]}</b><span class="ex">${esc(q.e)}</span><span class="ref">Gulati, Bab ${q.ch}: ${esc(CHAPTERS[q.ch])}</span></div>`:""}
  </article>
  <div class="nav">
    <button class="btn" id="prev" ${S.cur===0?"disabled":""}>← Sebelumnya</button>
    <button class="btn ${flagged?"flagged":""}" id="flag" aria-pressed="${flagged}">${flagged?"Hapus tanda":"Tandai untuk ditinjau"}</button>
    ${S.cur<n-1?`<button class="btn primary" id="next">Berikutnya →</button>`:`<button class="btn primary" id="end">${prac?"Lihat hasil":"Serahkan ujian"}</button>`}
  </div>
  ${showNav?`<div class="panel"><div class="legend"><span><i class="sw" style="background:var(--accent-soft);border-color:var(--accent)"></i>Terjawab</span><span><i class="sw" style="background:var(--surface)"></i>Belum</span><span><i class="sw" style="background:var(--flag);border-color:var(--flag);border-radius:50%;width:9px;height:9px"></i>Ditandai</span></div>
    <div class="grid">${S.items.map((x,i)=>{let c="cell";if(prac&&S.ans[i]!==undefined)c+=S.ans[i]===0?" r":" w";else if(S.ans[i]!==undefined)c+=" ans";if(S.flag[i])c+=" flg";if(i===S.cur)c+=" cur";return `<button class="${c}" data-go="${i}" aria-label="Soal ${i+1}">${i+1}</button>`}).join("")}</div></div>`:""}
  <p class="muted" style="font-size:12.5px;margin-top:18px">Pintasan: tombol 1–4 atau A–D memilih jawaban, ← → berpindah soal, F menandai.</p>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  $("#prev").onclick=()=>go(S.cur-1);
  if($("#next"))$("#next").onclick=()=>go(S.cur+1);
  if($("#end"))$("#end").onclick=askSubmit;
  $("#submit").onclick=askSubmit;
  $("#flag").onclick=()=>{S.flag[S.cur]=!S.flag[S.cur];save();render()};
  $("#toggleNav").onclick=()=>{showNav=!showNav;render()};
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  startTimer();
}
function choose(oi){if(S.mode==="practice"&&S.ans[S.cur]!==undefined)return;S.ans[S.cur]=oi;save();render()}
function go(i){if(i<0||i>=S.items.length)return;S.cur=i;save();render();const c=$(".qcard");if(c&&c.getBoundingClientRect().top<0)window.scrollTo(0,0)}
function askSubmit(){
  const n=S.items.length,a=Object.keys(S.ans).length,f=Object.values(S.flag).filter(Boolean).length;
  modal={title:S.mode==="exam"?"Serahkan ujian?":"Akhiri latihan?",body:(n-a?`${n-a} soal belum dijawab dan akan dihitung salah. `:"Semua soal sudah dijawab. ")+(f?`${f} soal masih ditandai.`:""),ok:S.mode==="exam"?"Serahkan":"Akhiri",fn:()=>finish(false)};renderModal();
}
function renderModal(){
  let el=$("#scrim");if(el)el.remove();if(!modal)return;
  el=document.createElement("div");el.id="scrim";el.className="scrim";
  el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(modal.title)}</h3><p class="muted">${esc(modal.body)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="mc">Batal</button><button class="btn primary" id="mo">${esc(modal.ok)}</button></div></div>`;
  document.body.appendChild(el);
  const close=()=>{modal=null;el.remove()};
  $("#mc").onclick=close;el.onclick=e=>{if(e.target===el)close()};
  $("#mo").onclick=()=>{const fn=modal.fn;close();fn()};$("#mo").focus();
}

function renderResult(){
  const n=S.items.length;let ok=0;const per={};
  S.items.forEach((it,i)=>{const p=BANK[it.id].p;per[p]=per[p]||[0,0];per[p][1]++;if(S.ans[i]===0){ok++;per[p][0]++}});
  const sc=pct(ok,n),unans=n-Object.keys(S.ans).length,used=S.finish-S.start;
  const R=62,C=2*Math.PI*R;
  const list=S.items.map((it,i)=>({it,i,q:BANK[it.id],a:S.ans[i]})).filter(x=>reviewFilter==="all"||(reviewFilter==="wrong"&&x.a!==0)||(reviewFilter==="flag"&&S.flag[x.i]));
  const weakest=Object.keys(per).sort((a,b)=>per[a][0]/per[a][1]-per[b][0]/per[b][1])[0];
  $("#app").innerHTML=`
  <div class="score">
    <svg class="gauge" viewBox="0 0 150 150" role="img" aria-label="Skor ${sc} persen">
      <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="14"/>
      <circle cx="75" cy="75" r="${R}" fill="none" stroke="${sc>=TARGET?"var(--ok)":"var(--bad)"}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*sc/100} ${C}" transform="rotate(-90 75 75)"/>
      <text x="75" y="82" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="26" font-weight="600" fill="var(--ink)">${Math.round(sc)}%</text>
    </svg>
    <div class="verdict">
      <span class="eyebrow">${esc(S.label)}${S.auto?" · waktu habis, diserahkan otomatis":""}</span>
      <div class="big">${ok} <span class="muted" style="font-size:28px">/ ${n} benar</span></div>
      <p>${sc>=TARGET?`<span class="tag ok">Di atas target latihan ${TARGET}%</span>`:`<span class="tag bad">Di bawah target latihan ${TARGET}%</span>`}</p>
      <p class="muted mono" style="font-size:13px">Waktu ${fmt(used)}${S.durMs?" dari "+fmt(S.durMs):""} · ${unans} tidak dijawab</p>
    </div>
  </div>
  <section style="margin-top:18px">
    <h2>Skor per pilar</h2>
    <div class="bars">${Object.keys(per).sort().map(p=>{const v=pct(per[p][0],per[p][1]);return `<div class="barrow" style="--pc:var(--p${p})"><span><span class="dot"></span> P${p} · ${PILLARS[p].id}</span><div class="meter" role="img" aria-label="${v}%"><i style="width:${v}%"></i><span class="target" style="left:${TARGET}%"></span></div><span class="mono">${per[p][0]}/${per[p][1]} · ${v}%</span></div>`}).join("")}
      <span class="muted" style="font-size:12.5px">Garis tipis = target ${TARGET}%.${Object.keys(per).length>1?` Fokus belajar berikutnya: <b>Pilar ${weakest} · ${PILLARS[weakest].id}</b>.`:""}</span></div>
  </section>
  <div class="row" style="margin-top:16px"><button class="btn primary" id="home">Kembali ke beranda</button>${S.mode==="practice"&&S.src?`<button class="btn" id="again">Ulangi latihan ini</button>`:""}</div>
  <section style="margin-top:30px">
    <h2>Pembahasan</h2>
    <div class="tabs" role="group" aria-label="Saring pembahasan">
      ${[["wrong","Salah & kosong ("+(n-ok)+")"],["flag","Ditandai ("+Object.values(S.flag).filter(Boolean).length+")"],["all","Semua ("+n+")"]].map(([k,t])=>`<button data-f="${k}" aria-pressed="${reviewFilter===k}">${t}</button>`).join("")}
    </div>
    ${list.length?list.map(({it,i,q,a})=>{const right=a===0;return `<article class="rev" style="--pc:var(--p${q.p})">
      <div class="qmeta"><span class="mono muted" style="font-size:13px">Soal ${i+1}</span><span class="row" style="gap:6px"><span class="tag"><span class="dot"></span>P${q.p}</span>${q.calc?`<span class="tag calc">Hitungan</span>`:""}<span class="tag ${right?"ok":"bad"}">${a===undefined?"Tidak dijawab":right?"Benar":"Salah"}</span></span></div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="ans">${a!==undefined&&!right?`<div><span>Jawaban Anda</span><span style="color:var(--bad)">${L[it.order.indexOf(a)]}. ${esc(q.opts[a])}</span></div>`:""}<div><span>Jawaban benar</span><span style="color:var(--ok);font-weight:600">${L[it.order.indexOf(0)]}. ${esc(q.opts[0])}</span></div></div>
      <div class="explain"><span class="ex">${esc(q.e)}</span><span class="ref">Gulati, Bab ${q.ch}: ${esc(CHAPTERS[q.ch])}</span></div></article>`}).join(""):`<p class="muted">Tidak ada soal pada filter ini.</p>`}
  </section>`;
  $("#home").onclick=()=>{S=null;view="home";render();window.scrollTo(0,0)};
  if($("#again"))$("#again").onclick=()=>{newSession(S.src);window.scrollTo(0,0)};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.f;render()});
}

document.addEventListener("keydown",e=>{
  if(modal){if(e.key==="Escape"){modal=null;renderModal()}return}
  if(view!=="quiz"||!S||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target.tagName;if(t==="INPUT"||t==="SELECT")return;
  const k=e.key.toLowerCase();const it=S.items[S.cur];
  const idx="1234".indexOf(k)>=0?"1234".indexOf(k):"abcd".indexOf(k);
  if(idx>=0&&k.length===1){choose(it.order[idx]);e.preventDefault()}
  else if(e.key==="ArrowRight"){go(S.cur+1);e.preventDefault()}
  else if(e.key==="ArrowLeft"){go(S.cur-1);e.preventDefault()}
  else if(k==="f"){S.flag[S.cur]=!S.flag[S.cur];save();render()}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
render();
})();
</script>
